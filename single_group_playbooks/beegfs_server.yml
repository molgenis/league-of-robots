#
# This play depends on:
#   * cluster_part1.yml
#
---
- name: Import pre deploy checks.
  ansible.builtin.import_playbook: pre_deploy_checks.yml

- name: '###==-> Extra roles for BeeGFS server. <-==###'
  hosts:
    - beegfs_server
  roles:
    - iptables
    - grub
    - locale
    - logrotate
    - remove
    - update
    - logins
    - sshd
    - basic_security
    - local_storage
    - role: perc_cli
      when: perc_devices is defined and perc_devices
    - local_storage
    - role: beegfs_server
      when: perc_devices is defined and perc_devices
...
