---
- name: Import pre deploy checks.
  ansible.builtin.import_playbook: pre_deploy_checks.yml

- name: '###==-> Roles for MANAGED chaperones <-==###'
  hosts:
    - chaperone
  roles:
    - role: ssh_host_signer
      when: test_chaperone is defined and test_chaperone
    - role: admin_users
      when:
        - test_chaperone is defined and test_chaperone
    - role: local_storage
      when:
        - local_mounts is defined
        - test_chaperone is defined and test_chaperone
    - name: '###==-> Roles for UNmanaged chaperones. <-==###'
  hosts:
    - chaperone
  roles:
    - ssh
    - locale
    - cluster
    - regular_users
    - shared_storage
    - sudoers
    - logs_toprm
    - build_environment
    - envsync
    - ogm
...
