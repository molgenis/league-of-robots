---
- name: Import pre deploy checks.
  ansible.builtin.import_playbook: pre_deploy_checks.yml

- name: Import initialization playbook for all hosts.
  ansible.builtin.import_playbook: init.yml

- name: '###==-> Roles for repo management servers. <-==###'
  hosts:
    - repo
    - repo_servers
  roles:
    - interfaces
    - iptables
    - ssh  # client
    - grub
    - swap
    - locale
    - logrotate
    - logins
    - sshd
    - basic_security
    - local_storage
    - remove
    - update

- name: '###==-> More roles for repo management servers. <-==###'
  hosts:
    - repo
    - repo_servers
  #
  # Use hard coded strategy linear to disable mitogen when present,
  # because mitogen fails to detect the ansible_python_interpreter correctly
  # when using delegate_to, which is used in the logs_client role.
  # There is no problem when the inventory_host for which a task is executed
  # has the same Python as the host to which the task is delegated.
  # But if the inventory_host's Python is missing on the delegate_to host,
  # then the task will fail.
  #
  strategy: linear
  roles:
    - role: logs_client
      when: ((rsyslog_external_servers is defined and ( rsyslog_external_servers|length>0 )) or ( cluster_class is defined ))
            and ( ansible_facts['os_family'] == "RedHat" )

- name: '###==-> Roles for Pulp repo management servers. <-==###'
  hosts: repo
  #
  # Use hard coded strategy linear to disable mitogen when present as it
  # cannot handle this combiantion of
  #     vars:
  #       ansible_python_interpreter: "/admin/{{ repo_management_user }}/pulp-cli.venv/bin/python3"
  #     become: true
  #     become_user: "{{ repo_management_user }}"
  # to execute a task using a different user and inside a Python virtual environment
  # located in the home dir of that different user: bummer.
  #
  strategy: linear
  roles:
    - pulp_server

- name: '###==-> Roles for centrally managed repository servers. <-==###'
  hosts: repo_servers
  roles:
    - repo_server
...
