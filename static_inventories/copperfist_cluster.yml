---
all:
  children:
    controller_api:
      hosts:
        localhost:
    jumphost:
      hosts:
        cf-porch:
          cloud_image: RockyLinux-9.3_xfs
          ansible_python_interpreter: /usr/bin/python3
          cloud_flavor: general.v1.small
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_jumphosts"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          basic_security_ssh_challenge_response_auth: 'yes' # Required for MFS in sshd_config.
          iptables_allow_icmp_inbound:
            - "{{ all.ip_addresses['umcg']['net1'] }}"
            - "{{ all.ip_addresses['umcg']['net2'] }}"
            - "{{ all.ip_addresses['umcg']['net3'] }}"
            - "{{ all.ip_addresses['umcg']['net4'] }}"
            - "{{ all.ip_addresses['rug']['bwp_net'] }}"
            - "{{ all.ip_addresses['rug']['operator'] }}"
          ssh_client_configs:
            - logs_library
          additional_etc_hosts:
            - group: docs_library
              nodes:
                - name: docs-on-bateleur
                  network: external
            - group: copperfist_cluster
              nodes:
                - name: cf-dragen
                  network: vlan16
                - name: copperfist
                  network: vlan16
    data_transfer:
      hosts:
        cf-transfer:
          cloud_image: RockyLinux-9.3_xfs
          cloud_flavor: general.v1.small
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_ds"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          local_yum_repository: true  # For nhc_standalone.
          local_volume_extra:
            - name: groups1
              size: 1536
            - name: groups2
              size: 1536
            - name: groups3
              size: 1536
            - name: groups4
              size: 1536
            - name: groups5
              size: 1536
            - name: groups6
              size: 1536
            - name: groups7
              size: 1536
            - name: groups8
              size: 1536
          local_mounts:
            - mount_point: '/groups'
              device: '/dev/md0'
              mounted_owner: root
              mounted_group: root
              mounted_mode: '0755'
              mount_options: rw,relatime,nofail,x-systemd.device-timeout=10
              type: ext4
              md:
                raid_level: 0
                raid_devices: 8
                component_devices:
                  - /dev/vdb
                  - /dev/vdc
                  - /dev/vdd
                  - /dev/vde
                  - /dev/vdf
                  - /dev/vdg
                  - /dev/vdh
                  - /dev/vdi
          local_mount_subfolders:
            - mount_point: '/groups'
              machines: "{{ groups['data_transfer'] }}"
              folders:
                - rel_paths:
                    - "{{ data_transfer_only_group }}"
                  mode: '2750'
                  owner: root
                  group: "{{ data_transfer_only_group }}"
                - rel_paths:
                    - umcg-gap
                    - umcg-genomescan
                    - umcg-gst
                  mode: '2770'
                  owner: root
          iptables_allow_icmp_inbound:
            - "{{ all.ip_addresses['umcg']['net1'] }}"
            - "{{ all.ip_addresses['umcg']['net2'] }}"
            - "{{ all.ip_addresses['umcg']['net3'] }}"
            - "{{ all.ip_addresses['umcg']['net4'] }}"
            - "{{ all.ip_addresses['rug']['bwp_net'] }}"
            - "{{ all.ip_addresses['rug']['operator'] }}"
            - "{{ all.ip_addresses['eramsmus_mc']['net'] }}"
            - "{{ all.ip_addresses['genomescan']['portal'] }}"
            - "{{ wingedhelix_cluster.ip_addresses['wh-porch']['wh_internal_management'] }}"
            - "{{ wingedhelix_cluster.ip_addresses['wh_internal_management-vlan16-router']['vlan16'] }}"
            - "{{ betabarrel_cluster.ip_addresses['bb-porch']['vlan1336'] }}"
            - "{{ betabarrel_cluster.ip_addresses['vlan1336-vlan16-router']['vlan16'] }}"
            - "{{ copperfist_cluster.ip_addresses['cf-porch']['cf_internal_management'] }}"
            - "{{ copperfist_cluster.ip_addresses['cf_internal_management-external-router']['external'] }}"
            - "{{ copperfist_cluster.ip_addresses['copperfist']['vlan16'] }}"
          iptables_allow_https_inbound:
            # On data_transfer servers port 443 is used for SSH too.
            - "{{ all.ip_addresses['umcg']['net1'] }}"
            - "{{ all.ip_addresses['umcg']['net2'] }}"
            - "{{ all.ip_addresses['umcg']['net3'] }}"
            - "{{ all.ip_addresses['umcg']['net4'] }}"
            - "{{ all.ip_addresses['rug']['bwp_net'] }}"
            - "{{ all.ip_addresses['rug']['operator'] }}"
            - "{{ all.ip_addresses['eramsmus_mc']['net'] }}"
            - "{{ all.ip_addresses['genomescan']['portal'] }}"
            - "{{ wingedhelix_cluster.ip_addresses['wh-porch']['wh_internal_management'] }}"
            - "{{ wingedhelix_cluster.ip_addresses['wh_internal_management-vlan16-router']['vlan16'] }}"
            - "{{ betabarrel_cluster.ip_addresses['bb-porch']['vlan1336'] }}"
            - "{{ betabarrel_cluster.ip_addresses['vlan1336-vlan16-router']['vlan16'] }}"
            - "{{ copperfist_cluster.ip_addresses['cf-porch']['cf_internal_management'] }}"
            - "{{ copperfist_cluster.ip_addresses['cf_internal_management-external-router']['external'] }}"
            - "{{ copperfist_cluster.ip_addresses['copperfist']['vlan16'] }}"
          iptables_allow_ssh_inbound:
            - "{{ all.ip_addresses['umcg']['net1'] }}"
            - "{{ all.ip_addresses['umcg']['net2'] }}"
            - "{{ all.ip_addresses['umcg']['net3'] }}"
            - "{{ all.ip_addresses['umcg']['net4'] }}"
            - "{{ all.ip_addresses['rug']['bwp_net'] }}"
            - "{{ all.ip_addresses['rug']['operator'] }}"
            - "{{ all.ip_addresses['eramsmus_mc']['net'] }}"
            - "{{ all.ip_addresses['genomescan']['portal'] }}"
            - "{{ wingedhelix_cluster.ip_addresses['wh-porch']['wh_internal_management'] }}"
            - "{{ wingedhelix_cluster.ip_addresses['wh_internal_management-vlan16-router']['vlan16'] }}"
            - "{{ betabarrel_cluster.ip_addresses['bb-porch']['vlan1336'] }}"
            - "{{ betabarrel_cluster.ip_addresses['vlan1336-vlan16-router']['vlan16'] }}"
            - "{{ copperfist_cluster.ip_addresses['cf-porch']['cf_internal_management'] }}"
            - "{{ copperfist_cluster.ip_addresses['cf_internal_management-external-router']['external'] }}"
            - "{{ copperfist_cluster.ip_addresses['copperfist']['vlan16'] }}"
    docs:
      hosts:
        docs-on-bateleur:
    sys_admin_interface:
      hosts:
        copperfist:
          os_distribution: 'centos7'
          host_networks:
            - name: vlan16
            - name: vlan990
              add_hostname_to_ip_address: true
          local_yum_repository: true # enable local yum repository
          local_mounts:
            - mount_point: '/mnt/local_raid'  # File system must already be available and hence created and labelled manually.
              device: 'LABEL=local_raid'
              mounted_owner: root
              mounted_group: root
              mounted_mode: '0755'
              mount_options: 'defaults,nofail,x-systemd.device-timeout=10'
              type: xfs
            - mount_point: "{{ slurm_local_scratch_dir }}"
              device: '/mnt/local_raid/local'
              mounted_owner: root
              mounted_group: root
              mounted_mode: '2755'
              mount_options: 'bind,nofail'
              type: none
          local_mount_subfolders:
            - mount_point: "{{ slurm_local_scratch_dir }}"
              machines: "{{ groups['compute_node'] }}"
              folders:
                - rel_paths:
                    - cache
                  mode: '2755'
                  owner: "{{ envsync_user }}"
                  group: "{{ envsync_group }}"
    deploy_admin_interface:
      hosts:
        copperfist:
          main_backup_folder: '/mnt/local_raid/local_backups/'
          local_backups: # list of folders for cron to make daily backup
            - name: apps # Name == ID; don't modify after deployed!
              src_path: '/apps'
              frequency:
               - { name: 'daily', hour: '5', minute: '47', day: '*', weekday: '*', month: '*', keep: '60', disabled: 'false' }
    user_interface:
      hosts:
        copperfist:
          slurm_sockets: 2
          slurm_cores_per_socket: 64
          slurm_real_memory: 515456
          slurm_local_disk: 0
          slurm_ethernet_interfaces:
            - em1
            - em3
    compute_node:
      children:
        regular:  # Must be item from {{ slurm_partitions }} variable defined in group_vars/{{ stack_name }}/vars.yml
          hosts:
            copperfist:
              slurm_sockets: 2
              slurm_cores_per_socket: 64
              slurm_real_memory: 515456
              slurm_max_cpus_per_node: "{{ slurm_sockets * slurm_cores_per_socket - 8 }}"
              slurm_max_mem_per_node: "{{ slurm_real_memory - 8 * 2048 }}"
              slurm_local_disk: 0
              slurm_ethernet_interfaces:
                - em1
                - em3
        dragen:  # Must be item from {{ slurm_partitions }} variable defined in group_vars/{{ stack_name }}/vars.yml
          hosts:
            cf-dragen:
              # ansible_host: cf-porch+copperfist+cf-dragen
              os_distribution: 'oracle8'
              host_networks:
                #
                # enp5s0:
                #   speed: 1 Gbit copper, physical connector shared with BMC.
                #   vlans:
                #     untagged: 990
                #     tagged: -
                # enp4s0:
                #   speed: 1 Gbit copper, not connected.
                # enp26s0f0:
                #   speed: 10 Gbit copper, but switch max 1 Gbit.
                #   vlans:
                #     untagged: 990
                # enp26s0f1:
                #   speed: 10 Gbit copper, not connected.
                # ens3f0 altname enp134s0f0:
                #   speed: 10 Gbit fibre
                #   vlans:
                #     untagged: 16
                #     tagged: 13, 16, 985, 990
                # ens3f1 altname enp134s0f1:
                #   speed: 10 Gbit fibre, not connected.
                #
                - name: vlan16
                  nmstate_interface:
                    name: ens3f0.16
                    type: vlan
                    vlan:
                      id: 16
                      base-iface: ens3f0  # altname enp134s0f0
                    ipv4:
                      dhcp: false
                - name: vlan990
                  add_hostname_to_ip_address: true
                  nmstate_interface:
                    name: ens3f0  # altname enp134s0f0
                    ipv4:
                      dhcp: false
              local_mounts:
                - mount_point: '/staging'
                  device: 'LABEL=staging'
                  mounted_owner: root
                  mounted_group: root
                  mounted_mode: '0755'
                  mount_options: 'defaults,noatime,nofail'
                  type: xfs
                - mount_point: "{{ slurm_local_scratch_dir }}"
                  device: '/staging/slurm'
                  mounted_owner: root
                  mounted_group: root
                  mounted_mode: '0755'
                  mount_options: 'bind,nofail'
                  type: none
              local_mount_subfolders:
                - mount_point: '/staging'
                  machines: "{{ groups['dragen'] }}"
                  folders:
                    - rel_paths:
                        - development
                      mode: '0770'
                      owner: umcg-atd-ateambot
                      group: umcg-atd
                    - rel_paths:
                        - slurm
                      mode: '0755'
                      owner: root
                      group: root
                - mount_point: "{{ slurm_local_scratch_dir }}"
                  machines: "{{ groups['dragen'] }}"
                  folders:
                    - rel_paths:
                        - cache
                      mode: '2755'
                      owner: "{{ envsync_user }}"
                      group: "{{ envsync_group }}"
              slurm_version: '20.11.9-1.el8.umcg'
              slurm_sockets: 2
              slurm_cores_per_socket: 16
              slurm_threads_per_core: 2
              slurm_real_memory: 515109
              slurm_max_cpus_per_node: "{{ slurm_sockets * slurm_cores_per_socket * slurm_threads_per_core - 2 }}"
              slurm_max_mem_per_node: "{{ slurm_real_memory - slurm_sockets * slurm_cores_per_socket * 512 }}"
              slurm_local_disk: 102400
              slurm_weight: 10
              local_yum_repository: true # enable local yum repository
    mit_chaperone:
      hosts:
        cf-chaperone:
          ansible_host: cf-chaperone.umcg.nl  # upzkh1056
          use_ldap: false
          functional_admin_group: 'MEDGEN-NFG GCC Analyse Team'
          #
          # Overrule regular_groups compared to rest of Winged Helix:
          # * Do not create local functional_admin_group, which comes from UMCG AD.
          #
          regular_groups:
            - name: "{{ envsync_group }}"
            - name: "{{ functional_users_group }}"
            - name: 'umcg-atd'
            - name: 'umcg-gap'
            - name: 'umcg-gd'
            - name: 'umcg-genomescan'
            - name: 'umcg-gsad'
            - name: 'umcg-gst'
            - name: 'umcg-lab'
            - name: 'umcg-labgnkbh'
            - name: 'umcg-logstoprm'
            - name: 'umcg-ogm'
            - name: 'umcg-patho'
            - name: 'umcg-pr'
            - name: 'umcg-vipt'
          ssh_client_configs:
            - logs_library
    storage_server:
      hosts:
        cf-storage:
          cloud_image: RockyLinux-9.3_xfs
          cloud_flavor: umcg.v2.bm.20-128-894
          host_type: baremetal
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: ens2f1np1
            - name: vlan990
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: ens2f0np0
          local_yum_repository: true # enable local yum repository for PERC CLI utility.
          perc_devices: true
          local_mounts:
            - mount_point: '/mnt/umcgst16'
              device: dynamic  # A value must be present in order to update it on-the-fly during role execution.
              perc_controller: 0
              perc_virtual_drive: 238
              mounted_owner: root
              mounted_group: root
              mounted_mode: '0755'
              mount_options: >-
                rw,relatime
                {%- if ansible_facts['os_family'] == 'RedHat' and
                       ansible_facts['distribution_major_version'] >= '8' -%}
                  ,nofail,x-systemd.device-timeout=10
                {%- endif -%}
              type: xfs
    smb_server:
      hosts:
        copperfist:
    nfs_server:
      hosts:
        cf-storage:
          nfs_server_shares:
            - path: '/mnt/umcgst16'
              clients: "{{ stack_networks
                           | selectattr('name', 'equalto', 'vlan990')
                           | map(attribute='cidr')
                           | first }}(rw,sync,no_root_squash,no_subtree_check)"
administration:
  children:
    storage_server:
    sys_admin_interface:
    deploy_admin_interface:
    user_interface:
cluster:
  children:
    compute_node:
    administration:
copperfist_cluster:
  children:
    controller_api:
    jumphost:
    cluster:
    chaperone:
    data_transfer:
    docs:
    smb_server:
    nfs_server:
chaperone:
  children:
    mit_chaperone:  # Special type of chaperone machine, which is partially managed by MIT.
...
