---
all:
  children:
    openstack_api:
      hosts:
        localhost:
          ansible_python_interpreter: /usr/bin/env python
    development:
      hosts:
        p2solo:
          host: reception+172.23.68.26
          ansible_host: reception+172.23.68.26
          cloud_flavor: hpc.v1.vm.1-2-20
          cloud_image: ubuntu-24.04-noble
          host_networks:
            - name: vlan1337
              security_group: "talos_cluster"
              add_hostname_to_ip_address: true
          #
          # Firewall configuration.
          #
          iptables_allow_icmp_inbound:
          - "{{ all.ip_addresses['umcg']['net1'] }}"
          - "{{ all.ip_addresses['umcg']['internal1'] }}"
          - "{{ all.ip_addresses['umcg']['basiswerkplek'] }}"
          - "{{ all.ip_addresses['umcg']['win10vdi'] }}"
          - "{{ all.ip_addresses['umcg']['net4'] }}"
          - "{{ talos_cluster.ip_addresses['reception']['vlan1337'] }}"
          - "{{ talos_cluster.ip_addresses['reception']['vlan16'] }}"

          iptables_allow_ssh_inbound:
          - "{{ all.ip_addresses['umcg']['net1'] }}"
          - "{{ all.ip_addresses['umcg']['internal1'] }}"
          - "{{ all.ip_addresses['umcg']['basiswerkplek'] }}"
          - "{{ all.ip_addresses['umcg']['win10vdi'] }}"
          - "{{ all.ip_addresses['umcg']['net4'] }}"
          - "{{ talos_cluster.ip_addresses['reception']['vlan1337'] }}"
          - "{{ talos_cluster.ip_addresses['reception']['vlan16'] }}"
    production:
      hosts:  
        p2solo-local:
          host: 192.168.64.7
          ansible_host: 192.168.64.7
          cloud_flavor: hpc.v1.vm.1-2-20
          cloud_image: ubuntu-24.04-noble
          host_networks:
            - name: vlan1337
              security_group: "talos_cluster"
              add_hostname_to_ip_address: true
          #
          # Firewall configuration.
          #
          iptables_allow_icmp_inbound:
          - "{{ all.ip_addresses['umcg']['net1'] }}"
          - "{{ all.ip_addresses['umcg']['internal1'] }}"
          - "{{ all.ip_addresses['umcg']['basiswerkplek'] }}"
          - "{{ all.ip_addresses['umcg']['win10vdi'] }}"
          - "{{ all.ip_addresses['umcg']['net4'] }}"
          - "{{ talos_cluster.ip_addresses['reception']['vlan1337'] }}"
          - "{{ talos_cluster.ip_addresses['reception']['vlan16'] }}"
          - { 'address': '127.0.0.1', 'netmask': '/24', 'desc': 'local vm' }
          - { 'address': '192.168.64.1', 'netmask': '/24', 'desc': 'local vm' }

          iptables_allow_ssh_inbound:
          - "{{ all.ip_addresses['umcg']['net1'] }}"
          - "{{ all.ip_addresses['umcg']['internal1'] }}"
          - "{{ all.ip_addresses['umcg']['basiswerkplek'] }}"
          - "{{ all.ip_addresses['umcg']['win10vdi'] }}"
          - "{{ all.ip_addresses['umcg']['net4'] }}"
          - "{{ talos_cluster.ip_addresses['reception']['vlan1337'] }}"
          - "{{ talos_cluster.ip_addresses['reception']['vlan16'] }}"
          - { 'address': '127.0.0.1', 'netmask': '/24', 'desc': 'local vm' }
          - { 'address': '192.168.64.1', 'netmask': '/24', 'desc': 'local vm' }
p2solo_server:
  children:
    openstack_api:
    development:
      p2solo:
    production:
      p2solo-local:
...
