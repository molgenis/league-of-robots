---
all:
  children:
    controller_api:
      hosts:
        localhost:
    jumphost:
      hosts:
        tunnel:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: vlan1338
              security_group: "{{ stack_prefix }}_jumphosts"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
          basic_security_ssh_challenge_response_auth: 'yes' # Required for MFS in sshd_config.
          local_yum_repository: true
    repo:
      hosts:
        nb-repo:
          cloud_flavor: umcg.v1.vm.4-8
          host_networks:
            - name: vlan1338
              security_group: "{{ stack_prefix }}_repo"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
          swap_file_size: 2
    data_transfer:
      hosts:
        nb-transfer:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: vlan1338
              security_group: "{{ stack_prefix }}_ds"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
          local_yum_repository: true  # For nhc_standalone.
          local_volume_extra:
            - name: groups
              size: 10000
    docs:
      hosts:
        docs-on-bateleur:
    sys_admin_interface:
      hosts:
        nb-sai:
          cloud_flavor: umcg.v1.vm.4-8
          host_networks:
            - name: vlan1338
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp6s0
            - name: vlan985
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp3s0
              lnet:
                name: tcp14
            - name: vlan1068
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp4s0
              lnet:
                name: tcp20
            - name: vlan1073
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp5s0
              lnet:
                name: tcp15
          postfix_hostname: "{{ listserv_domain_name }}"
    deploy_admin_interface:
      hosts:
        nb-dai:
          cloud_flavor: umcg.v1.vm.4-8
          host_networks:
            - name: vlan1338
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp6s0
            - name: vlan985
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp3s0
              lnet:
                name: tcp14
            - name: vlan1068
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp4s0
              lnet:
                name: tcp20
            - name: vlan1073
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp5s0
              lnet:
                name: tcp15
          local_volume_extra:
            - name: apps
              size: 3000
    user_interface:
      hosts:
        nibbler:
          cloud_flavor: umcg.v1.vm.16-64
          host_networks:
            - name: vlan1338
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
            - name: vlan985
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp4s0
              lnet:
                name: tcp14
            - name: vlan1068
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp5s0
              lnet:
                name: tcp20
            - name: vlan1073
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp6s0
              lnet:
                name: tcp15
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_cluster"
              nmstate_interface:
                name: enp7s0
                ipv4:
                  auto-route-metric: 80
          slurm_sockets: 16
          slurm_cores_per_socket: 1
          slurm_real_memory: 63785
          slurm_local_disk: 0
    compute_node:
      children:
        cpu_r6515:  # Must be item from {{ slurm_partitions }} variable defined in group_vars/{{ stack_name }}/vars.yml
          hosts:
            nb-node-a[01:05]:
              cloud_flavor: umcg.v1.bm.64-512-0.vlan1338
              host_type: baremetal
              host_networks:
                - name: vlan1338
                  security_group: "{{ stack_prefix }}_cluster"
                  add_hostname_to_ip_address: true
                  nmstate_interface:
                    name: enp65s0np0
                - name: vlan1068
                  security_group: "{{ stack_prefix }}_storage"
                  attach_port_on_instance_launch: false  # Not possible for bare metal on Merlin. Must configure NICs after boot.
                  nmstate_interface:
                    name: enp65s0np0.1068
                    type: vlan
                    vlan:
                      id: 1068
                      base-iface: enp65s0np0
                    ipv4:
                      dhcp: false
                  lnet:
                    name: tcp20
              disabled_network_interfaces:
                - name: eno1
                - name: eno2
              perc_devices: true
              local_mounts:
                - mount_point: "{{ slurm_local_scratch_dir }}"
                  device: '/dev/nvme0n1'
                  mounted_owner: root
                  mounted_group: root
                  mounted_mode: '0755'
                  mount_options: >-
                    rw,relatime
                    {%- if ansible_facts['os_family'] == 'RedHat' and
                           ansible_facts['distribution_major_version'] >= '8' -%}
                      ,nofail,x-systemd.device-timeout=10
                    {%- endif -%}
                  type: ext4
              slurm_sockets: 1
              slurm_cores_per_socket: 64
              slurm_real_memory: 514857
              slurm_local_disk: 3002000
              slurm_weight: 5
        gpu_a40:  # Must be item from {{ slurm_partitions }} variable defined in group_vars/{{ stack_name }}/vars.yml
          hosts:
            nb-node-b01:
              cloud_flavor: umcg.v1.bm.64-256-440.vlan1338.16a40
              host_type: baremetal
              gpu_count: 16
              gpu_type: a40
              gpu_driver_version: 615.71.09
              gpu_kernel_module_type: proprietary
              host_networks:
                - name: vlan1338
                  security_group: "{{ stack_prefix }}_cluster"
                  add_hostname_to_ip_address: true
                  nmstate_interface:
                    name: enp65s0f1np1  # altname ens3f1np1
                - name: vlan1068
                  security_group: "{{ stack_prefix }}_storage"
                  attach_port_on_instance_launch: false  # Not possible for bare metal on Merlin. Must configure NICs after boot.
                  nmstate_interface:
                    name: ens3f1np1.1068  # Use short altname here, because primary parent interface name + VLAN ID is too long (> 15 characters).
                    type: vlan
                    vlan:
                      id: 1068
                      base-iface: enp65s0f1np1  # Parent interface name.
                    ipv4:
                      dhcp: false
                  lnet:
                    name: tcp20
              disabled_network_interfaces:
                - name: eno1
                - name: eno2
                - name: enp65s0f0np0
              perc_devices: false
              local_mounts:
                - mount_point: "{{ slurm_local_scratch_dir }}"
                  device: '/dev/nvme1n1'
                  label: local
                  mounted_owner: root
                  mounted_group: root
                  mounted_mode: '0755'
                  mount_options: >-
                    rw,relatime
                    {%- if ansible_facts['os_family'] == 'RedHat' and
                           ansible_facts['distribution_major_version'] >= '8' -%}
                      ,nofail,x-systemd.device-timeout=10
                    {%- endif -%}
                  type: ext4
              slurm_sockets: 1
              slurm_cores_per_socket: 64
              slurm_real_memory: 256800
              slurm_local_disk: 1420000
              slurm_weight: 10
        cpu_r630:  # Must be item from {{ slurm_partitions }} variable defined in group_vars/{{ stack_name }}/vars.yml
          hosts:
            nb-node-c[01:11]:
              cloud_flavor: umcg.v1.bm.28-256-0.vlan1338
              host_type: baremetal
              host_networks:
                - name: vlan1338
                  security_group: "{{ stack_prefix }}_cluster"
                  add_hostname_to_ip_address: true
                  nmstate_interface:
                    name: enp130s0f0
                - name: vlan1068
                  security_group: "{{ stack_prefix }}_storage"
                  attach_port_on_instance_launch: false  # Not possible for bare metal on Merlin. Must configure NICs after boot.
                  nmstate_interface:
                    name: enp130s0f0.1068
                    type: vlan
                    vlan:
                      id: 1068
                      base-iface: enp130s0f0
                    ipv4:
                      dhcp: false
                  lnet:
                    name: tcp20
              disabled_network_interfaces:
                - name: eno1
                - name: eno2
                - name: eno3
                - name: eno4
                - name: enp130s0f1
              perc_devices: true
              local_mounts:
                - mount_point: "{{ slurm_local_scratch_dir }}"
                  device: dynamic  # A value must be present in order to update it on-the-fly during role execution.
                  label: local
                  perc_controller: 0
                  perc_virtual_drive: 1
                  mounted_owner: root
                  mounted_group: root
                  mounted_mode: '0755'
                  mount_options: >-
                    rw,relatime
                    {%- if ansible_facts['os_family'] == 'RedHat' and
                           ansible_facts['distribution_major_version'] >= '8' -%}
                      ,nofail,x-systemd.device-timeout=10
                    {%- endif -%}
                  type: ext4
              slurm_sockets: 2
              slurm_cores_per_socket: 14
              slurm_real_memory: 257317
              slurm_local_disk: 3002000
administration:
  children:
    sys_admin_interface:
    deploy_admin_interface:
    user_interface:
cluster:
  children:
    compute_node:
    administration:
nibbler_cluster:
  children:
    controller_api:
    jumphost:
    repo:
    cluster:
    data_transfer:
    docs:
...
