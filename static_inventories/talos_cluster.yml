---
all:
  children:
    openstack_api:
      hosts:
        localhost:
          ansible_python_interpreter: /usr/bin/env python
    jumphost:
      hosts:
        reception:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: vlan1337
              security_group: "{{ stack_prefix }}_jumphosts"
              assign_floating_ip: true
          basic_security_ssh_challenge_response_auth: 'yes' # Required for MFS in sshd_config.
          local_yum_repository: true
    repo:
      hosts:
        tl-repo:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: vlan1337
              security_group: "{{ stack_prefix }}_repo"
          swap_file_size: 2
    data_transfer:
      hosts:
        tl-transfer:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: vlan1337
              security_group: "{{ stack_prefix }}_ds"
              assign_floating_ip: false
          local_volume_size_extra: 100
          local_mount_subfolders:
            - mount_point: '/groups'
              machines: "{{ groups['data_transfer'] }}"
              folders:
                - rel_paths:
                    - "{{ data_transfer_only_group }}"
                  mode: '2750'
                  owner: root
                  group: "{{ data_transfer_only_group }}"
                - rel_paths:
                    - umcg-atd
                    - umcg-gsad
                    - umcg-gst
                  mode: '2770'
                  owner: root
    docs:
      hosts:
        docs-on-bateleur:
    sys_admin_interface:
      hosts:
        tl-sai:
          cloud_flavor: umcg.v1.vm.4-8
          host_networks:
            - name: vlan1337
              security_group: "{{ stack_prefix }}_cluster"
            - name: vlan1068
              security_group: "{{ stack_prefix }}_storage"
          lustre_client_networks: "{{ lustre_client_networks_vm }}"
    deploy_admin_interface:
      hosts:
        tl-dai:
          cloud_flavor: umcg.v1.vm.4-8
          host_networks:
            - name: vlan1337
              security_group: "{{ stack_prefix }}_cluster"
            - name: vlan1068
              security_group: "{{ stack_prefix }}_storage"
          lustre_client_networks: "{{ lustre_client_networks_vm }}"
          local_volume_size_extra: 300
    user_interface:
      hosts:
        talos:
          cloud_flavor: umcg.v1.vm.4-8
          host_networks:
            - name: vlan1337
              security_group: "{{ stack_prefix }}_cluster"
            - name: vlan1068
              security_group: "{{ stack_prefix }}_storage"
          lustre_client_networks: "{{ lustre_client_networks_vm }}"
          slurm_sockets: 4
          slurm_cores_per_socket: 1
          slurm_real_memory: 7684
          slurm_local_disk: 0
          slurm_features: 'prm08,tmp08'
          slurm_ethernet_interfaces:
            - enp3s0
            - enp4s0
    compute_node:
      children:
        regular:  # Must be item from {{ slurm_partitions }} variable defined in group_vars/{{ stack_name }}/vars.yml
          hosts:
            tl-node-a01:
              cloud_flavor: umcg.v1.bm.28-256-0
              host_type: baremetal
              host_networks:
                - name: vlan1337
                  security_group: "{{ stack_prefix }}_cluster"
                - name: vlan1068
                  security_group: "{{ stack_prefix }}_storage"
                  attach_port_on_instance_launch: false  # Not possible for bare metal on Merlin. Must configure NICs after boot.
              lustre_client_networks: "{{ lustre_client_networks_baremetal }}"
              perc_devices: true
              local_mounts:
                - mount_point: "{{ slurm_local_scratch_dir }}"
                  device: '/dev/sda'
                  mounted_owner: root
                  mounted_group: root
                  mounted_mode: '0755'
                  mount_options: >-
                    rw,relatime
                    {%- if ansible_facts['os_family'] == 'RedHat' and
                           ansible_facts['distribution_major_version'] >= '8' -%}
                      ,nofail,x-systemd.device-timeout=10
                    {%- endif -%}
                  type: ext4
              local_volume_size_extra: 0  # No extra virtual disk present on bare metal nodes.
              slurm_sockets: 2
              slurm_cores_per_socket: 14
              slurm_real_memory: 257320
              slurm_max_cpus_per_node: "{{ slurm_sockets * slurm_cores_per_socket - 2 }}"
              slurm_max_mem_per_node: "{{ slurm_real_memory - slurm_sockets * slurm_cores_per_socket * 256 }}"
              slurm_local_disk: 3002000
              slurm_features: 'tmp08'
              slurm_ethernet_interfaces:
                - enp130s0f0
                - enp130s0f0.1068
    chaperone:
      hosts:
        tl-chaperone:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: vlan1337
              security_group: "{{ stack_prefix }}_cluster"
          #
          # Overrule regular users and groups compared to rest of Talos:
          #
          use_ldap: false
          use_sssd: false
          regular_groups:
            - "{{ envsync_group }}"
            - "{{ functional_admin_group }}"
            - "{{ functional_users_group }}"
            - 'umcg-atd'
            - 'umcg-gsad'
            - 'umcg-gst'
            - 'umcg-vipt'
          regular_users:
            - user: "{{ envsync_user }}"
              groups: ["{{ envsync_group }}", "{{ functional_users_group }}"]
            - user: 'umcg-molgenis'
              groups: ["{{ envsync_group }}", 'umcg-atd', 'umcg-gsad', 'umcg-gst', "{{ functional_users_group }}"]
            - user: 'umcg-atd-ateambot'
              groups: ['umcg-atd', "{{ functional_users_group }}"]
            - user: 'umcg-atd-dm'
              groups: ['umcg-atd', "{{ functional_users_group }}"]
            - user: 'umcg-gsad-ateambot'
              groups: ['umcg-gsad', "{{ functional_users_group }}"]
            - user: 'umcg-gsad-dm'
              groups: ['umcg-gsad', "{{ functional_users_group }}"]
            - user: 'umcg-gst-dm'
              groups: ['umcg-gst', "{{ functional_users_group }}"]
            - user: 'umcg-vipt-dm'
              groups: ['umcg-vipt', "{{ functional_users_group }}"]
            - user: 'mbenjamins'
              groups: ["{{ envsync_group }}", 'umcg-atd', 'umcg-gsad', 'umcg-gst', 'umcg-vipt']
            - user: 'mbijlsma'
              groups: ["{{ envsync_group }}", 'umcg-atd', 'umcg-gsad', 'umcg-gst', 'umcg-vipt']
            - user: 'bcharbon'
              groups: ["{{ envsync_group }}", 'umcg-atd', 'umcg-gsad', 'umcg-vipt']
            - user: 'scimerman'
              groups: ["{{ envsync_group }}", 'umcg-atd', 'umcg-gsad', 'umcg-gst', 'umcg-vipt']
            - user: 'dhendriksen'
              groups: ["{{ envsync_group }}", 'umcg-atd', 'umcg-gsad', 'umcg-vipt']
            - user: 'kdelange'
              groups: ["{{ envsync_group }}", 'umcg-atd', 'umcg-gsad', 'umcg-gst', 'umcg-vipt']
            - user: 'rkanninga'
              groups: ["{{ envsync_group }}", 'umcg-atd', 'umcg-gsad', 'umcg-gst', 'umcg-vipt']
            - user: 'pneerincx'
              groups: ["{{ envsync_group }}", 'umcg-atd', 'umcg-gsad', 'umcg-gst', 'umcg-vipt']
            - user: 'gvdvries'
              groups: ["{{ envsync_group }}", 'umcg-atd', 'umcg-gsad', 'umcg-gst', 'umcg-vipt']
          sudoers:
            - who: ['%umcg-atd', '%umcg-gsad', '%umcg-gst']
              become: 'umcg-molgenis'
            - who: ['%umcg-atd']
              become: 'umcg-atd-dm'
            - who: ['%umcg-atd']
              become: 'umcg-atd-ateambot'
            - who: ['%umcg-gsad']
              become: 'umcg-gsad-ateambot'
            - who: ['%umcg-gsad']
              become: 'umcg-gsad-dm'
            - who: ['%umcg-gst']
              become: 'umcg-gst-ateambot'
            - who: ['%umcg-gst']
              become: 'umcg-gst-dm'
            - who: ['%umcg-vipt']
              become: 'umcg-vipt-dm'
          ssh_client_configs:
            - logs_library
          lfs_mounts: []  # Overrule the list of network shares; we use local storage instead.
          local_volume_size_extra: 200  # The extra virtual disk for dat* and prm*
          local_mounts:
            - mount_point: '/groups'
              device: '/dev/vdb'
              mounted_owner: root
              mounted_group: root
              mounted_mode: '0755'
              mount_options: >-
                rw,relatime
                {%- if ansible_facts['os_family'] == 'RedHat' and
                       ansible_facts['distribution_major_version'] >= '8' -%}
                  ,nofail,x-systemd.device-timeout=10
                {%- endif -%}
              type: ext4
          local_mount_subfolders:
            - mount_point: '/groups'
              machines: "{{ groups['chaperone'] }}"
              folders:
                - rel_paths:
                    - umcg-atd
                  mode: '0755'
                  owner: root
                  group: root
                - rel_paths:
                    - umcg-atd/dat08
                  mode: '2770'
                  owner: umcg-atd-dm
                  group: umcg-atd
                - rel_paths:
                    - umcg-atd/prm08
                  mode: '2750'
                  owner: umcg-atd-dm
                  group: umcg-atd
                - rel_paths:
                    - umcg-gsad
                  mode: '0755'
                  owner: root
                  group: root
                - rel_paths:
                    - umcg-gsad/dat08
                  mode: '2770'
                  owner: umcg-gsad-dm
                  group: umcg-gsad
                - rel_paths:
                    - umcg-gsad/prm08
                  mode: '2750'
                  owner: umcg-gsad-dm
                  group: umcg-gsad
                - rel_paths:
                    - umcg-gst
                  mode: '0755'
                  owner: root
                  group: root
                - rel_paths:
                    - umcg-gst/dat08
                  mode: '2770'
                  owner: umcg-gst-dm
                  group: umcg-gst
administration:
  children:
    sys_admin_interface:
    deploy_admin_interface:
    user_interface:
cluster:
  children:
    compute_node:
    administration:
talos_cluster:
  children:
    openstack_api:
    jumphost:
    repo:
    cluster:
    chaperone:
    data_transfer:
    docs:
...
