---
all:
  children:
    openstack_api:
      hosts:
        localhost:
          ansible_python_interpreter: /usr/bin/env python
    jumphost:
      hosts:
        foyer:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_jumphosts"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
          basic_security_ssh_challenge_response_auth: 'yes' # Required for MFS in sshd_config.
          local_yum_repository: true
    repo:
      hosts:
        vt-repo:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_repo"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
          swap_file_size: 2
    data_transfer:
      hosts:
#        vt-transfer:
#          cloud_flavor: umcg.v1.vm.1-2
#          host_networks:
#            - name: "{{ stack_prefix }}_internal_management"
#              security_group: "{{ stack_prefix }}_ds"
#              assign_floating_ip: true
#              add_hostname_to_ip_address: true
#          local_volume_extra:
#            - name: groups
#              size: 10000
    docs:
      hosts:
        docs-on-bateleur:
    sys_admin_interface:
      hosts:
        vt-sai:
          cloud_flavor: umcg.v1.vm.4-8
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
            - name: DH4 Lustre
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp4s0
              lnet:
                name: tcp14
            - name: lustre
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp5s0
              lnet:
                name: tcp15
    deploy_admin_interface:
      hosts:
        vt-dai:
          cloud_flavor: umcg.v1.vm.4-8
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
            - name: DH4 Lustre
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp4s0
              lnet:
                name: tcp14
            - name: lustre
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp5s0
              lnet:
                name: tcp15
          local_volume_extra:
            - name: apps
              size: 1000
    user_interface:
      hosts:
        vaxtron:
          cloud_flavor: umcg.v1.vm.16-64
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
            - name: DH4 Lustre
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp4s0
              lnet:
                name: tcp14
            - name: lustre
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp5s0
              lnet:
                name: tcp15
          slurm_sockets: 16
          slurm_cores_per_socket: 1
          slurm_real_memory: 63786
          slurm_local_disk: 0
          slurm_features: 'prm02,prm03,rsc04,tmp04'
    compute_node:
      children:
        cpu_r750:  # Must be item from {{ slurm_partitions }} variable defined in group_vars/{{ stack_name }}/vars.yml
          hosts:
            vt-node-a[01:04]:
              cloud_flavor: umcg_bigmem
              host_type: baremetal
              host_networks:
                - name: "{{ stack_prefix }}_internal_management"
                  security_group: "{{ stack_prefix }}_cluster"
                  add_hostname_to_ip_address: true
                  nmstate_interface:
                    name: eno12409np1
                - name: lustre
                  security_group: "{{ stack_prefix }}_storage"
                  nmstate_interface:
                    name: eno12399np0
                  lnet:
                    name: tcp15
              perc_devices: true
              local_mounts:
                - mount_point: "{{ slurm_local_scratch_dir }}"
                  device: dynamic  # A value must be present in order to update it on-the-fly during role execution.
                  label: local
                  perc_controller: 0
                  perc_virtual_drive: 239
                  mounted_owner: root
                  mounted_group: root
                  mounted_mode: '0755'
                  mount_options: >-
                    rw,relatime
                    {%- if ansible_facts['os_family'] == 'RedHat' and
                           ansible_facts['distribution_major_version'] >= '8' -%}
                      ,nofail,x-systemd.device-timeout=10
                    {%- endif -%}
                  type: ext4
              slurm_sockets: 2
              slurm_cores_per_socket: 32
              slurm_real_memory: 2063193
              slurm_max_cpus_per_node: "{{ slurm_sockets * slurm_cores_per_socket - 2 }}"
              slurm_max_mem_per_node: "{{ slurm_real_memory - slurm_sockets * slurm_cores_per_socket * 512 }}"
              slurm_local_disk: 3420400
              slurm_features: 'rsc04,tmp04'
              slurm_weight: 10
        cpu_r6625:  # Must be item from {{ slurm_partitions }} variable defined in group_vars/{{ stack_name }}/vars.yml
          hosts:
            vt-node-b[01:06]:
              cloud_flavor: umcg.v1.bm.192-768-0
              host_type: baremetal
              host_networks:
                - name: "{{ stack_prefix }}_internal_management"
                  security_group: "{{ stack_prefix }}_cluster"
                  add_hostname_to_ip_address: true
                  nmstate_interface:
                    name: eno12409
                - name: lustre
                  security_group: "{{ stack_prefix }}_storage"
                  nmstate_interface:
                    name: eno12399
                  lnet:
                    name: tcp15
              perc_devices: true
              local_mounts:
                - mount_point: "{{ slurm_local_scratch_dir }}"
                  device: dynamic  # A value must be present in order to update it on-the-fly during role execution.
                  label: local
                  perc_controller: 0
                  perc_virtual_drive: 239
                  mounted_owner: root
                  mounted_group: root
                  mounted_mode: '0755'
                  mount_options: >-
                    rw,relatime
                    {%- if ansible_facts['os_family'] == 'RedHat' and
                           ansible_facts['distribution_major_version'] >= '8' -%}
                      ,nofail,x-systemd.device-timeout=10
                    {%- endif -%}
                  type: ext4
              slurm_sockets: 2
              slurm_cores_per_socket: 96
              slurm_real_memory: 773020
              slurm_max_cpus_per_node: "{{ slurm_sockets * slurm_cores_per_socket - 2 }}"
              slurm_max_mem_per_node: "{{ slurm_real_memory - slurm_sockets * slurm_cores_per_socket * 512 }}"
              slurm_local_disk: 2850100
              slurm_features: 'rsc04,tmp04'
administration:
  children:
    sys_admin_interface:
    deploy_admin_interface:
    user_interface:
cluster:
  children:
    compute_node:
    administration:
vaxtron_cluster:
  children:
    openstack_api:
    jumphost:
    repo:
    cluster:
    data_transfer:
    docs:
...
