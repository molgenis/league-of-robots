---
all:
  children:
    controller_api:
      hosts:
        localhost:
          ansible_python_interpreter: /usr/bin/env python
    jumphost:
      hosts:
        corridor:
          cloud_flavor: 1c2m20d
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_jumphosts"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
    repo:
      hosts:
        fd-repo:
          cloud_flavor: 4c4m60d
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_repo"
              add_hostname_to_ip_address: true
    docs:
      hosts:
        docs-on-bateleur:
    sys_admin_interface:
      hosts:
        fd-sai:
          cloud_flavor: 4c4m60d
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
            - name: subnet-nfs-data-2541
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp4s0
    deploy_admin_interface:
      hosts:
        fd-dai:
          cloud_flavor: 4c4m60d
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
            - name: subnet-nfs-data-2541
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp4s0
          local_volume_extra:
            - name: apps
              size: 2000
    ldap_server:
      hosts:
        fd-dai:
    user_interface:
      hosts:
        fender:
          cloud_flavor: 4c8m80d
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
            - name: subnet-nfs-data-2541
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp4s0
          slurm_sockets: 4
          slurm_cores_per_socket: 1
          slurm_real_memory: 7681
          slurm_local_disk: 0
          slurm_features: 'prm10,tmp10'
    compute_node:
      children:
        regular:  # Must be item from {{ slurm_partitions }} variable defined in group_vars/{{ stack_name }}/vars.yml
          hosts:
            fd-node-a[01:08]:
              cloud_flavor: 16c64m100d
              host_networks:
                - name: "{{ stack_prefix }}_internal_management"
                  security_group: "{{ stack_prefix }}_cluster"
                  add_hostname_to_ip_address: true
                  nmstate_interface:
                    name: enp3s0
                - name: subnet-nfs-data-2541
                  security_group: "{{ stack_prefix }}_storage"
                  nmstate_interface:
                    name: enp4s0
              local_volume_extra:
                - name: local
                  size: 1
              slurm_sockets: 16
              slurm_cores_per_socket: 1
              slurm_real_memory: 63786
              slurm_max_cpus_per_node: "{{ slurm_sockets * slurm_cores_per_socket - 2 }}"
              slurm_max_mem_per_node: "{{ slurm_real_memory - slurm_sockets * slurm_cores_per_socket * 512 }}"
              slurm_local_disk: 900
              slurm_features: 'tmp10'
administration:
  children:
    sys_admin_interface:
    deploy_admin_interface:
    user_interface:
    ldap_server:
cluster:
  children:
    compute_node:
    administration:
fender_cluster:
  children:
    controller_api:
    jumphost:
    repo:
    cluster:
    docs:
...
