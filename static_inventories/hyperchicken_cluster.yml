---
all:
  children:
    controller_api:
      hosts:
        localhost:
    jumphost:
      hosts:
        portal:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_jumphosts"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
    repo:
      hosts:
        hc-repo:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_repo"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
    docs:
      hosts:
        docs-on-bateleur:
    sys_admin_interface:
      hosts:
        hc-sai:
          cloud_flavor: umcg.v1.vm.4-8
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
            - name: lustre
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp4s0
              lnet:
                name: tcp15
    deploy_admin_interface:
      hosts:
        hc-dai:
          cloud_flavor: umcg.v1.vm.4-8
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
            - name: lustre
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp4s0
              lnet:
                name: tcp15
          local_volume_extra:
            - name: apps
              size: 300
    user_interface:
      hosts:
        hyperchicken:
          cloud_flavor: umcg.v1.vm.4-8
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: enp3s0
            - name: lustre
              security_group: "{{ stack_prefix }}_storage"
              nmstate_interface:
                name: enp4s0
              lnet:
                name: tcp15
          slurm_sockets: 4
          slurm_cores_per_socket: 1
          slurm_real_memory: 7680
          slurm_local_disk: 0
    compute_node:
      children:
        cpu_vm:  # Must be item from {{ slurm_partitions }} variable defined in group_vars/{{ stack_name }}/vars.yml
          hosts:
            hc-node-a01:
              cloud_flavor: umcg.v1.vm.4-8
              host_networks:
                - name: "{{ stack_prefix }}_internal_management"
                  security_group: "{{ stack_prefix }}_cluster"
                  add_hostname_to_ip_address: true
                  nmstate_interface:
                    name: enp3s0
                - name: lustre
                  security_group: "{{ stack_prefix }}_storage"
                  nmstate_interface:
                    name: enp4s0
                  lnet:
                    name: tcp15
              local_volume_extra:
                - name: local
                  size: 1
              slurm_sockets: 4
              slurm_cores_per_socket: 1
              slurm_real_memory: 7680
              slurm_max_cpus_per_node: "{{ slurm_sockets * slurm_cores_per_socket - 2 }}"
              slurm_max_mem_per_node: "{{ slurm_real_memory - slurm_sockets * slurm_cores_per_socket * 512 }}"
              slurm_local_disk: 900
administration:
  children:
    sys_admin_interface:
    deploy_admin_interface:
    user_interface:
cluster:
  children:
    compute_node:
    administration:
hyperchicken_cluster:
  children:
    controller_api:
    jumphost:
    repo:
    cluster:
    docs:
...
