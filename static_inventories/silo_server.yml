---
all:
  children:
    openstack_api:
      hosts:
        localhost:
          ansible_python_interpreter: /usr/bin/env python
    jumphost:
      hosts:
        lobby:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_jumphosts"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          local_yum_repository: true
    repo:
      hosts:
        silo-repo:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_repo"
              add_hostname_to_ip_address: true
              nmstate_interface:
                name: eth0
          swap_file_size: 2
    silo:
      hosts:
        silo-01:
          cloud_flavor: umcg.v1.vm.4-8
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_webservers"
              add_hostname_to_ip_address: true
              assign_floating_ip: true
silo_server:
  children:
    openstack_api:
    jumphost:
    repo:
    silo:
...
