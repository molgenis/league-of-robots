---
all:
  children:
    controller_api:
      hosts:
        localhost:
          ansible_python_interpreter: python3
    jumphost:
      hosts:
        spring:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_jumphosts"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
#              nmstate_interface:
#                name: eth0
          basic_security_ssh_challenge_response_auth: 'yes' # Required for MFS in sshd_config.
          local_yum_repository: true
    repo_server:
      hosts:
        repo-primary:
          azure_flavor: "Standard_DS1_v2"
          cloud_user: centos
          host_networks:
            - name: "{{ stack_prefix }}_external"
              security_group: "{{ stack_prefix }}_repository"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          local_volume_extra:
            - name: mnt
              size: 1024
          local_mounts:
            - mount_point: '/mnt/repos'
              label: repos
              device: /dev/sdc # A value must be present in order to update it on-the-fly during role execution.
              mounted_owner: root
              mounted_group: root
              mounted_mode: '0755'
              mount_options: rw,relatime,nofail,x-systemd.device-timeout=10
              type: xfs
          additional_etc_hosts:
            - group: patchcord_library
              nodes:
                - name: spring
                  network: vlan1066
        repo-secondary:
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_repository"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          local_volume_extra:
            - name: mnt
              size: 500
          local_mounts:
            - mount_point: '/mnt/repos'
              label: repos
              device: /dev/vdb # A value must be present in order to update it on-the-fly during role execution.
              mounted_owner: root
              mounted_group: root
              mounted_mode: '0755'
              mount_options: rw,relatime,nofail,x-systemd.device-timeout=10
              type: xfs
# cluster:
#   children:
patchcord_library:
  children:
    controller_api:
    jumphost:
    repo_server:
#     cluster:
...
