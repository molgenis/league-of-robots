---
all:
  children:
    openstack_api:
      hosts:
        localhost:
          ansible_python_interpreter: /usr/bin/env python
    jumphost:
      hosts:
        bb-porch:
          cloud_image: RockyLinux-9.3_xfs
          os_distribution: 'rocky9'
          ansible_python_interpreter: /usr/bin/python3
          cloud_flavor: m1.small
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_jumphosts"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          basic_security_ssh_challenge_response_auth: 'yes' # Required for MFS in sshd_config.
          iptables_allow_icmp_inbound:
            - "{{ all.ip_addresses['umcg']['net1'] }}"
            - "{{ all.ip_addresses['umcg']['net2'] }}"
            - "{{ all.ip_addresses['umcg']['net3'] }}"
            - "{{ all.ip_addresses['umcg']['net4'] }}"
            - "{{ all.ip_addresses['rug']['bwp_net'] }}"
            - "{{ all.ip_addresses['rug']['operator'] }}"
          ssh_client_configs:
            - logs_library
          additional_etc_hosts:
            - group: docs_library
              nodes:
                - name: docs-on-bateleur
                  network: external
            - group: betabarrel_cluster
              nodes:
                - name: bb-dragen
                  network: vlan16
            - group: betabarrel_cluster
              nodes:
                - name: betabarrel
                  network: vlan16
            - group: copperfist_cluster
              nodes:
                - name: copperfist
                  network: vlan16
        bb-porch-1336:
          ansible_host: bb-porch-1336
          cloud_image: Rocky-9.5
          cloud_user: rocky
          os_distribution: 'rocky9'
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: vlan1336
              security_group: "{{ stack_prefix }}_jumphosts"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          basic_security_ssh_challenge_response_auth: 'yes' # Required for MFS in sshd_config.
          iptables_allow_icmp_inbound:
            - "{{ all.ip_addresses['umcg']['net1'] }}"
            - "{{ all.ip_addresses['umcg']['net2'] }}"
            - "{{ all.ip_addresses['umcg']['net3'] }}"
            - "{{ all.ip_addresses['umcg']['net4'] }}"
            - "{{ all.ip_addresses['rug']['bwp_net'] }}"
            - "{{ all.ip_addresses['rug']['operator'] }}"
          ssh_client_configs:
            - logs_library
          additional_etc_hosts:
            - group: docs_library
              nodes:
                - name: docs-on-bateleur
                  network: external
            - group: betabarrel_cluster
              nodes:
                - name: bb-dragen
                  network: vlan16
            - group: betabarrel_cluster
              nodes:
                - name: betabarrel
                  network: vlan16
            - group: copperfist_cluster
              nodes:
                - name: copperfist
                  network: vlan16
        az-porch:
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_jumphosts"
              add_hostname_to_ip_address: true
          basic_security_ssh_challenge_response_auth: 'yes' # Required for MFS in sshd_config.
          iptables_allow_icmp_inbound:
            - "{{ all.ip_addresses['umcg']['net1'] }}"
            - "{{ all.ip_addresses['umcg']['net2'] }}"
            - "{{ all.ip_addresses['umcg']['net3'] }}"
            - "{{ all.ip_addresses['umcg']['net4'] }}"
            - "{{ all.ip_addresses['rug']['bwp_net'] }}"
            - "{{ all.ip_addresses['rug']['operator'] }}"
          ssh_client_configs:
            - logs_library
    data_transfer:
      hosts:
        bb-transfer:
          cloud_image: RockyLinux-9.3_xfs
          os_distribution: 'rocky9'
          cloud_flavor: m1.small
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_ds"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          local_volume_size_extra: 8300
          iptables_allow_icmp_inbound:
            - "{{ all.ip_addresses['umcg']['net1'] }}"
            - "{{ all.ip_addresses['umcg']['net2'] }}"
            - "{{ all.ip_addresses['umcg']['net3'] }}"
            - "{{ all.ip_addresses['umcg']['net4'] }}"
            - "{{ all.ip_addresses['rug']['bwp_net'] }}"
            - "{{ all.ip_addresses['rug']['operator'] }}"
            - "{{ all.ip_addresses['genomescan']['portal'] }}"
            - "{{ wingedhelix_cluster.ip_addresses['wh-porch']['wh_internal_management'] }}"
            - "{{ wingedhelix_cluster.ip_addresses['wh_internal_management-vlan16-router']['vlan16'] }}"
            - "{{ betabarrel_cluster.ip_addresses['bb-porch']['bb_internal_management'] }}"
            - "{{ betabarrel_cluster.ip_addresses['bb_internal_management-vlan16-router']['vlan16'] }}"
            - "{{ betabarrel_cluster.ip_addresses['betabarrel']['vlan16'] }}"
            - "{{ copperfist_cluster.ip_addresses['cf-porch']['cf_internal_management'] }}"
            - "{{ copperfist_cluster.ip_addresses['cf_internal_management-external-router']['external'] }}"
            - "{{ copperfist_cluster.ip_addresses['copperfist']['vlan16'] }}"
          iptables_allow_https_inbound:
            # On data_transfer servers port 443 is used for SSH too.
            - "{{ all.ip_addresses['umcg']['net1'] }}"
            - "{{ all.ip_addresses['umcg']['net2'] }}"
            - "{{ all.ip_addresses['umcg']['net3'] }}"
            - "{{ all.ip_addresses['umcg']['net4'] }}"
            - "{{ all.ip_addresses['rug']['bwp_net'] }}"
            - "{{ all.ip_addresses['rug']['operator'] }}"
            - "{{ all.ip_addresses['genomescan']['portal'] }}"
            - "{{ wingedhelix_cluster.ip_addresses['wh-porch']['wh_internal_management'] }}"
            - "{{ wingedhelix_cluster.ip_addresses['wh_internal_management-vlan16-router']['vlan16'] }}"
            - "{{ betabarrel_cluster.ip_addresses['bb-porch']['bb_internal_management'] }}"
            - "{{ betabarrel_cluster.ip_addresses['bb_internal_management-vlan16-router']['vlan16'] }}"
            - "{{ betabarrel_cluster.ip_addresses['betabarrel']['vlan16'] }}"
            - "{{ copperfist_cluster.ip_addresses['cf-porch']['cf_internal_management'] }}"
            - "{{ copperfist_cluster.ip_addresses['cf_internal_management-external-router']['external'] }}"
            - "{{ copperfist_cluster.ip_addresses['copperfist']['vlan16'] }}"
          iptables_allow_ssh_inbound:
            - "{{ all.ip_addresses['umcg']['net1'] }}"
            - "{{ all.ip_addresses['umcg']['net2'] }}"
            - "{{ all.ip_addresses['umcg']['net3'] }}"
            - "{{ all.ip_addresses['umcg']['net4'] }}"
            - "{{ all.ip_addresses['rug']['bwp_net'] }}"
            - "{{ all.ip_addresses['rug']['operator'] }}"
            - "{{ all.ip_addresses['genomescan']['portal'] }}"
            - "{{ wingedhelix_cluster.ip_addresses['wh-porch']['wh_internal_management'] }}"
            - "{{ wingedhelix_cluster.ip_addresses['wh_internal_management-vlan16-router']['vlan16'] }}"
            - "{{ betabarrel_cluster.ip_addresses['bb-porch']['bb_internal_management'] }}"
            - "{{ betabarrel_cluster.ip_addresses['bb_internal_management-vlan16-router']['vlan16'] }}"
            - "{{ betabarrel_cluster.ip_addresses['betabarrel']['vlan16'] }}"
            - "{{ copperfist_cluster.ip_addresses['cf-porch']['cf_internal_management'] }}"
            - "{{ copperfist_cluster.ip_addresses['cf_internal_management-external-router']['external'] }}"
            - "{{ copperfist_cluster.ip_addresses['copperfist']['vlan16'] }}"
    docs:
      hosts:
        docs-on-bateleur:
    sys_admin_interface:
      hosts:
        betabarrel:
          host_networks:
            - name: vlan16
              add_hostname_to_ip_address: true
            - name: vlan990
          local_yum_repository: true # enable local yum repository
          local_mounts:
            - mount_point: '/mnt/local_raid'  # File system must already be available and hence created and labelled manually.
              device: 'LABEL=local_raid'
              mounted_owner: root
              mounted_group: root
              mounted_mode: '0755'
              mount_options: 'defaults,nofail,x-systemd.device-timeout=10'
              type: xfs
            - mount_point: '/local'
              device: '/mnt/local_raid/local'
              mounted_owner: root
              mounted_group: root
              mounted_mode: '2755'
              mount_options: 'bind,nofail'
              type: none
    deploy_admin_interface:
      hosts:
        betabarrel:
          main_backup_folder: '/mnt/local_raid/local_backups/'
          local_backups: # list of folders for cron to make daily backup
            - name: apps # Name == ID; don't modify after deployed!
              src_path: '/apps'
              frequency:
               - { name: 'daily', hour: '5', minute: '47', day: '*', weekday: '*', month: '*', keep: '60', disabled: 'false' }
    user_interface:
      hosts:
        betabarrel:
          slurm_sockets: 2
          slurm_cores_per_socket: 64
          slurm_real_memory: 515456
          slurm_local_disk: 0
          slurm_features: 'tmp05'  # Beta-Barrel will replace Zinc-Finger
          slurm_ethernet_interfaces:
            - em1
            - em3
    compute_node:
      children:
        regular:  # Must be item from {{ slurm_partitions }} variable defined in group_vars/{{ stack_name }}/vars.yml
          hosts:
            betabarrel:
              slurm_sockets: 2
              slurm_cores_per_socket: 64
              slurm_real_memory: 515456
              slurm_max_cpus_per_node: "{{ slurm_sockets * slurm_cores_per_socket - 8 }}"
              slurm_max_mem_per_node: "{{ slurm_real_memory - 8 * 2048 }}"
              slurm_local_disk: 0
              slurm_features: 'tmp05,tmp15'
              slurm_ethernet_interfaces:
                - em1
                - em3
        dragen:  # Must be item from {{ slurm_partitions }} variable defined in group_vars/{{ stack_name }}/vars.yml
          hosts:
            bb-dragen:
              ansible_host: bb-porch+betabarrel+bb-dragen
              os_distribution: 'oracle8'
              local_mounts:
                - mount_point: '/staging'
                  device: 'LABEL=staging'
                  mounted_owner: root
                  mounted_group: root
                  mounted_mode: '0755'
                  mount_options: 'defaults,noatime,nofail'
                  type: xfs
                - mount_point: '/local'
                  device: '/staging/slurm'
                  mounted_owner: root
                  mounted_group: root
                  mounted_mode: '0755'
                  mount_options: 'bind,nofail'
                  type: none
              slurm_version: '20.11.9-1.el8.umcg'
              slurm_sockets: 2
              slurm_cores_per_socket: 16
              slurm_threads_per_core: 2
              slurm_real_memory: 515109
              slurm_max_cpus_per_node: "{{ slurm_sockets * slurm_cores_per_socket * slurm_threads_per_core - 2 }}"
              slurm_max_mem_per_node: "{{ slurm_real_memory - slurm_sockets * slurm_cores_per_socket * 512 }}"
              slurm_local_disk: 102400
              slurm_features: 'tmp15,dragen'
              slurm_ethernet_interfaces:
                - enp26s0f0  # VLAN990
                - enp5s0  # BMC
                - ens3f0.16  # VLAN16
              slurm_weight: 10
              local_yum_repository: true # enable local yum repository
    mit_chaperone:
      hosts:
        bb-chaperone:
          ansible_host: bb-chaperone.umcg.nl  # upzkh1055
          use_ldap: false
          functional_admin_group: 'MEDGEN-NFG GCC Analyse Team'
          #
          # Overrule regular_groups compared to rest of Winged Helix:
          # * Do not create local functional_admin_group, which comes from UMCG AD.
          #
          regular_groups:
            - name: "{{ envsync_group }}"
            - name: "{{ functional_users_group }}"
            - name: 'umcg-atd'
            - name: 'umcg-gap'
            - name: 'umcg-gd'
            - name: 'umcg-genomescan'
            - name: 'umcg-gsad'
            - name: 'umcg-gst'
            - name: 'umcg-lab'
            - name: 'umcg-labgnkbh'
            - name: 'umcg-logstoprm'
            - name: 'umcg-ogm'
            - name: 'umcg-patho'
            - name: 'umcg-pr'
            - name: 'umcg-vipt'
          ssh_client_configs:
            - logs_library
    storage_server:
      hosts:
        bb-storage:
          ansible_host: bb-porch-1336+bb-storage
          cloud_image: Rocky-9.5
          cloud_user: rocky
          os_distribution: 'rocky9'
          cloud_flavor: umcg.v2.bm.20-128-894
          host_type: baremetal
          host_networks:
            - name: vlan1336
              security_group: "{{ stack_prefix }}_cluster"
              add_hostname_to_ip_address: true
            - name: vlan990
              security_group: "{{ stack_prefix }}_storage"
              attach_port_on_instance_launch: false  # Not possible for bare metal on Merlin. Must configure NICs after boot.
#               nmstate_interface:
#                 name: enp65s0np0.990
#                 type: vlan
#                 vlan:
#                   id: 990
#                   base-iface: enp65s0np0
#                 ipv4:
#                   dhcp: false
          local_yum_repository: true # enable local yum repository for PERC CLI utility.
          perc_devices: true
          local_mounts:
            - mount_point: '/mnt/umcgst15'
              device: '/dev/data/hdd'
              mounted_owner: root
              mounted_group: root
              mounted_mode: '0755'
              mount_options: >-
                rw,relatime
                {%- if ansible_facts['os_family'] == 'RedHat' and
                       ansible_facts['distribution_major_version'] >= '8' -%}
                  ,nofail,x-systemd.device-timeout=10
                {%- endif -%}
              type: xfs
          local_volume_size_extra: 0  # No extra virtual disk present on bare metal nodes.
    smb_server:
      hosts:
        betabarrel:
    nfs_server:
      hosts:
        bb-storage:
          nfs_server_shares:
            - path: '/mnt/umcgst15'
              clients: "{{ stack_networks
                           | selectattr('name', 'equalto', 'vlan990')
                           | map(attribute='cidr')
                           | first }}(rw,sync,no_root_squash,no_subtree_check)"
administration:
  children:
    storage_server:
    sys_admin_interface:
    deploy_admin_interface:
    user_interface:
cluster:
  children:
    compute_node:
    administration:
betabarrel_cluster:
  children:
    openstack_api:
    jumphost:
    cluster:
    chaperone:
    data_transfer:
    docs:
    smb_server:
    nfs_server:
chaperone:
  children:
    mit_chaperone:  # Special type of chaperone machine, which is partially managed by MIT.
...
