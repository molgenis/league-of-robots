---
all:
  children:
    controller_api:
      hosts:
        localhost:
    jumphost:
      hosts:
        hatch:
          cluster_class: 'research'
          azure_flavor: "Standard_DS1_v2"
          host_networks:
            - name: "{{ stack_prefix }}_external"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          basic_security_ssh_challenge_response_auth: 'yes' # Required for MFS in sshd_config.
          local_yum_repository: true
    logs:
      hosts:
        earl1:
          cluster_class: 'development'
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          local_volume_extra:
            - name: mnt
              size: 100
        earl2:
          cluster_class: 'development'
          azure_flavor: "Standard_DS1_v2"
          host_networks:
            - name: "{{ stack_prefix }}_external"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
        earl3:
          cluster_class: 'diagnostics'
          azure_flavor: "Standard_DS1_v2"
          host_networks:
            - name: "{{ stack_prefix }}_external"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
        earl4:
          cluster_class: 'diagnostics'
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          local_volume_extra:
            - name: mnt
              size: 100 
        earl5:
          cluster_class: 'research'
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          local_volume_extra:
            - name: mnt
              size: 100 
        earl6:
          cluster_class: 'research'
          azure_flavor: "Standard_DS1_v2"
          host_networks:
            - name: "{{ stack_prefix }}_external"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
    repo_servers:
      hosts:
        repo-primary:
          cluster_class: 'development'
          azure_flavor: "Standard_DS1_v2"
          host_networks:
            - name: "{{ stack_prefix }}_external"
              security_group: "{{ stack_prefix }}_repository"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          local_volume_extra:
            - name: mnt
              size: 1024
          local_mounts:
            - mount_point: '/mnt/repos'
              device: /dev/sda # A value must be present in order to update it on-the-fly during role execution.
              mounted_owner: root
              mounted_group: root
              mounted_mode: '0755'
              mount_options: >-
                rw,relatime
                {%- if ansible_facts['os_family'] == 'RedHat' and
                       ansible_facts['distribution_major_version'] >= '8' -%}
                  ,nofail,x-systemd.device-timeout=10
                {%- endif -%}
              type: xfs
        repo-secondary:
          cluster_class: 'development'
          cloud_flavor: umcg.v1.vm.1-2
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_repository"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
          local_volume_extra:
            - name: mnt
              size: 500
          local_mounts:
            - mount_point: '/mnt/repos'
              device: /dev/vdb # A value must be present in order to update it on-the-fly during role execution.
              mounted_owner: root
              mounted_group: root
              mounted_mode: '0755'
              mount_options: >-
                rw,relatime
                {%- if ansible_facts['os_family'] == 'RedHat' and
                       ansible_facts['distribution_major_version'] >= '8' -%}
                  ,nofail,x-systemd.device-timeout=10
                {%- endif -%}
              type: xfs
logs_library:
  children:
    controller_api:
    logs:
    repo_servers:
    jumphost:
...
