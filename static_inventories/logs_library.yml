---
all:
  children:
    openstack_api:
      hosts:
        localhost:
          ansible_python_interpreter: /usr/bin/env python
    logs:
      hosts:
        earl1:
          cluster_class: 'development'
          cloud_flavor: m1.small
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
          local_volume_size_extra: 100
        earl2:
          cluster_class: 'development'
          azure_flavor: "Standard_DS1_v2"
          host_networks:
            - name: "{{ stack_prefix }}_external"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
        earl3:
          cluster_class: 'diagnostics'
          azure_flavor: "Standard_DS1_v2"
          host_networks:
            - name: "{{ stack_prefix }}_external"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
        earl4:
          cluster_class: 'diagnostics'
          cloud_flavor: m1.small
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
          local_volume_size_extra: 100
        earl5:
          cluster_class: 'research'
          cloud_flavor: m1.small
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
          local_volume_size_extra: 100
        earl6:
          cluster_class: 'research'
          azure_flavor: "Standard_DS1_v2"
          host_networks:
            - name: "{{ stack_prefix }}_external"
              security_group: "{{ stack_prefix }}_logservers"
              assign_floating_ip: true
logs_library:
  children:
    openstack_api:
    logs:
...
