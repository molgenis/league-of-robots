---
all:
  children:
    controller_api:
      hosts:
        localhost:
          ansible_python_interpreter: /usr/bin/env python
    build_server:
      hosts:
        rocky9-build:
          cloud_flavor: umcg.v1.vm.4-8
          cloud_image: Rocky-9.5
          cloud_user: rocky
          os_distribution: 'rocky9'
          ansible_host: tunnel+rocky9-build
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_webservers"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
build_library:
  children:
    controller_api:
    build_server:
cluster:
  children:
...
