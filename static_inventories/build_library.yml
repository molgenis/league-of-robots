---
all:
  children:
    controller_api:
      hosts:
        localhost:
    build_server:
      hosts:
        alma9-build:
          cloud_flavor: umcg.v1.vm.4-8
          cloud_image: AlmaLinux-9-GenericCloud-9.8-20260526
          os_distribution: 'alma9'
          ansible_host: tunnel+alma9-build
          host_networks:
            - name: "{{ stack_prefix }}_internal_management"
              security_group: "{{ stack_prefix }}_webservers"
              assign_floating_ip: true
              add_hostname_to_ip_address: true
build_library:
  children:
    controller_api:
    build_server:
cluster:
  children:
...
