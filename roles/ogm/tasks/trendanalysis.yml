---
- name: Deploy OGM TrendAnalysis script
  ansible.builtin.template:
    src: templates/ogm_trendanalysis.sh.j2
    dest: ~umcg-ogm-dm/trendanalysis-{{ ogm_server.split('.')[0] }}.sh
    owner: umcg-ogm-dm
    group: umcg-ogm-dm
    mode: '0750'
  become: true

- name: Trendanalysis cronjob
  ansible.builtin.cron:
    name: "trendanalysis_{{ ogm_server.split('.')[0] }} # Unique ID required to update existing cronjob: do not modify."
    weekday: '5' # on Fridays
    hour: "{{ 59 | random(seed=inventory_hostname) }}"
    minute: "{{ 59 | random(seed=inventory_hostname) }}"
    user: 'umcg-ogm-dm'
    job: "/bin/bash -c '~/trendanalysis-{{ ogm_server.split('.')[0] }}.sh >> ~/trendanalysis-{{ ogm_server.split('.')[0] }}.sh.log 2>&1'"
    cron_file: "trendanalysis_{{ ogm_server.split('.')[0] }}"
    disabled: "{{ trendanalysis_cron_disabled }}"
  become: true
...
