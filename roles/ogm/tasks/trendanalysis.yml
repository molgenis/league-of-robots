---
- name: Deploy OGM TrendAnalysis script
  ansible.builtin.template:
    src: templates/ogm_trendanalysis.sh.j2
    dest: ~umcg-ogm-dm/trendanalysis-{{ ogm_server.split('.')[0] }}.sh
    owner: umcg-ogm-dm
    group: umcg-ogm-dm
    mode: '0750'
  become: true

- name: Adds PATH on top of cronjob
  ansible.builtin.cron:
    name: PATH
    env: yes
    user: 'umcg-ogm-dm'
    job: /usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
    cron_file: "trendanalysis_{{ ogm_server.split('.')[0] }}"
  become: true

- name: Trendanalysis cronjob
  ansible.builtin.cron:
    name: "trendanalysis_{{ srvid }} # Unique ID required to update existing cronjob: do not modify."
    weekday: '6' # on Fridays
    hour: "14"
    minute: "{{ 59 | random(seed=inventory_hostname) }}"
    user: 'umcg-ogm-dm'
    job: "/bin/bash -c 'parallax.sh --command=\"~/trendanalysis-{{ srvid }}.sh >> trendanalysis-{{ srvid }}.sh.log 2>&1\" --lock-dir=\"{{ item.prm_location }}/lock_dirs/trendanalysis-{{ srvid }}/\" --log-file=\"~/trendanalysis-{{ srvid }}.cron.log\"'"
    cron_file: "ogm_trendanalysis_{{ srvid }}"
    disabled: "{{ trendanalysis_cron_disabled }}"
  vars:
    srvid: "{{ ogm_server.split('.')[0] }}"
  become: true
...
