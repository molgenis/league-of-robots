---
- name: Deploy backup script
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - src: templates/ogm_cron_make_backup.sh.j2
      dest: ~umcg-ogm-dm/make_backup.sh
      owner: umcg-ogm-dm
      group: umcg-ogm-dm
      mode: '0750'
    - src: templates/ogm_cron_clean_psql_backups.sh.j2
      dest: ~umcg-ogm-dm/manage_psql_backups.sh
      owner: umcg-ogm-dm
      group: umcg-ogm-dm
      mode: '0750'
  become: true

- name: 'Create cron job to make daily backup with the script'
  ansible.builtin.cron:
    name: "{{ item.name }}"
    weekday: "{{ item.weekday }}"
    hour: "{{ item.hour }}"
    minute: "{{ item.minute }}"
    user: "{{ item.user }}"
    job: "{{ item.job }}"
    cron_file: "{{ item.cron_file }}"
  loop:
    - name: 'Backup_OGM_data  # Unique ID required to update existing cronjob: do not modify.'
      weekday: '*'
      hour: '02'
      minute: '31'
      user: 'umcg-ogm-dm'
      job: /bin/bash -c '~/make_backup.sh >> ~/make_backup.sh.log'
      cron_file: 'ogm_make_backup'
    - name: 'Clean_OGM_psql_backups  # Unique ID required to update existing cronjob: do not modify.'
      weekday: '*'
      hour: '07'
      minute: '23'
      user: 'umcg-ogm-dm'
      job: "/bin/bash -c '~/manage_psql_backups.sh >> ~/manage_psql_backups.sh.log'"
      cron_file: 'ogm_clean_psql_backups'
  become: true

- name: Deploy OGM TrendAnalysis script
  ansible.builtin.template:
    src: templates/ogm_cron_trendanalysis.sh.j2
    dest: ~umcg-ogm-dm/trendanalysis-{{ item.server.split('.')[0] }}.sh
    owner: umcg-ogm-dm
    group: umcg-ogm-dm
    mode: '0750'
  loop: "{{ ogm_servers }}"
  when: item.trendanalysis_cron_disabled is defined and item.trendanalysis_cron_disabled is false
  become: true

- name: Trendanalysis cronjob
  ansible.builtin.cron:
    name: "trendanalysis_{{ item.server.split('.')[0] }} # Unique ID required to update existing cronjob: do not modify."
    weekday: '5'
    hour: '06'
    minute: '{{ 59 | random(seed=inventory_hostname) }}'
    user: 'umcg-ogm-dm'
    job: "/bin/bash -c '~/trendanalysis-{{ item.server.split('.')[0] }}.sh >> ~/trendanalysis-{{ item.server.split('.')[0] }}.sh.log'"
    cron_file: "trendanalysis_{{ item.server.split('.')[0] }}"
    disabled: "{{ item.trendanalysis_cron_disabled }}"
  loop: "{{ ogm_servers }}"
  when: item.trendanalysis_cron_disabled is defined
  become: true
...
