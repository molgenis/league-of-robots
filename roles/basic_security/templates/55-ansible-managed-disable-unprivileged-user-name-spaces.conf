# {{ ansible_managed }}
#
# Unprivileged user namespaces are required for a.o. container workloads (Apptainer)
# Putting code in containers may improve security as compared to running the code directlty on a machine without container,
# but unprivileged user namespaces also increase attack surface.
# Therefore we disable unprivileged user namespaces in machines that do not need to run container workloads.
#
user.max_user_namespaces = 0