---
- name: Restart sshd
  ansible.builtin.service:
    name: "{{ basic_security_sshd_name }}"
    state: "{{ basic_security_ssh_restart_handler_state }}"
  become: true
  listen: basic_security_restart_sshd

- name: 'Restart irqbalance service.'
  ansible.builtin.systemd:
    name: irqbalance.service
    state: restarted
    daemon_reload: true
  become: true
  listen: basic_security_restart_irqbalance

- name: 'Reboot to apply changed sysctl settings.'
  ansible.builtin.reboot:
    msg: 'Reboot initiated by Ansible "basic_security" role from League of Robots playbook/repo.'
  become: true
  listen: basic_security_reboot
...
