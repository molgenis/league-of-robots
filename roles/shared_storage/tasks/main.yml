---
#
##
### Mount complete PFS-ses and create all required LFS-ses and subfolders on them with the correct permissions.
##
#
- name: 'Create credential files for mounting cifs shares.'
  ansible.builtin.template:
    src: 'templates/credentials.cifs'
    dest: "/etc/sysconfig/{{ item.pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}.cifs"
    mode: '0600'
    owner: root
    group: root
  with_items: "{{ pfs_mounts | selectattr('type', 'equalto', 'cifs') | list }}"
  when: inventory_hostname in item.machines | default([])
  become: true

- name: 'Mount complete Physical File Systems (PFS-ses).'
  ansible.posix.mount:  # noqa jinja[spacing]
    path: "/mnt/{{ item.pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}"
    src: "{{ item.source }}/{{ item.pfs }}"
    fstype: "{{ item.type }}"
    opts: "{{ item.rw_options }}{{ extra_opts }}"
    state: 'mounted'
  vars:
    extra_opts: >-
      {%- if item.type == 'cifs' -%}
      ,credentials=/etc/sysconfig/{{ item.pfs | regex_replace('\$$', '') | regex_replace('/', '_') }}.cifs,uid=root,gid=root,dir_mode=02750,file_mode=0640
      {%- endif -%}
  with_items: "{{ pfs_mounts | rejectattr('type', 'equalto', 'beegfs') | list }}"
  when: inventory_hostname in item.machines | default([])
  become: true

- name: 'Create "home" Logical File System (LFS) on Physical File Systems (PFSs).'
  ansible.builtin.file:
    path: "/mnt/{{ item.pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}/{{ item.lfs }}"
    owner: 'root'
    group: 'root'
    mode: '0755'
    state: 'directory'
  with_items: "{{ lfs_mounts | selectattr('lfs', 'search', 'home') | list }}"
  when: inventory_hostname in pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='machines') | first | default([])
  become: true

- name: 'Create root groups folder for "tmp", "rsc", "prm" and "dat" Logical File Systems (LFSs) on Physical File Systems (PFSs).'
  ansible.builtin.file:
    path: "/mnt/{{ item.pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}/groups"
    owner: 'root'
    group: 'root'
    mode: '0755'
    state: 'directory'
  with_items:
    - "{{ lfs_mounts | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$') | list }}"
  tags:
    - groups
  when: inventory_hostname in pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='machines') | first | default([])
  become: true

- name: 'Create folder for each group on Physical File Systems (PFSs).'
  ansible.builtin.file:
    path: "/mnt/{{ item.0.pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}/groups/{{ item.1.name }}"
    owner: 'root'
    group: "{{ item.1.name }}"
    mode: '2750'
    state: 'directory'
  with_subelements:
    - "{{ lfs_mounts | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$') | list }}"
    - 'groups'
  tags:
    - groups
  when: inventory_hostname in pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='machines') | first | default([])
  become: true

- name: 'Create "tmp" Logical File Systems (LFSs) for each group on Physical File Systems (PFSs).'
  ansible.builtin.file:
    path: "/mnt/{{ item.0.pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}/groups/{{ item.1.name }}/{{ item.0.lfs }}"
    owner: "{{ item.1.name }}-dm"
    group: "{{ item.1.name }}"
    mode: "{{ item.1.mode | default('2750', true) }}"
    state: 'directory'
  with_subelements:
    - "{{ lfs_mounts | selectattr('lfs', 'search', 'tmp[0-9]+$') | list }}"
    - 'groups'
  tags:
    - groups
  when: inventory_hostname in pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='machines') | first | default([])
  become: true

- name: 'Create "rsc" Logical File Systems (LFSs) for each group on Physical File Systems (PFSs).'
  ansible.builtin.file:
    path: "/mnt/{{ item.0.pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}/groups/{{ item.1.name }}/{{ item.0.lfs }}"
    owner: "{{ item.1.name }}-dm"
    group: "{{ item.1.name }}"
    mode: "{{ item.1.mode | default('2750', true) }}"
    state: 'directory'
  with_subelements:
    - "{{ lfs_mounts | selectattr('lfs', 'search', 'rsc[0-9]+$') | list }}"
    - 'groups'
  tags:
    - groups
  when: inventory_hostname in pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='machines') | first | default([])
  become: true

- name: 'Create "prm" Logical File Systems (LFSs) for each group on Physical File Systems (PFSs).'
  ansible.builtin.file:
    path: "/mnt/{{ item.0.pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}/groups/{{ item.1.name }}/{{ item.0.lfs }}"
    owner: "{{ item.1.name }}-dm"
    group: "{{ item.1.name }}"
    mode: "{{ item.1.mode | default('2750', true) }}"
    state: 'directory'
  with_subelements:
    - "{{ lfs_mounts | selectattr('lfs', 'search', 'prm[0-9]+$') | list }}"
    - 'groups'
  tags:
    - groups
  when: inventory_hostname in pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='machines') | first | default([])
  become: true

- name: 'Create "dat" Logical File Systems (LFSs) for each group on Physical File Systems (PFSs).'
  ansible.builtin.file:
    path: "/mnt/{{ item.0.pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}/groups/{{ item.1.name }}/{{ item.0.lfs }}"
    owner: "{{ item.1.name }}-dm"
    group: "{{ item.1.name }}"
    mode: "{{ item.1.mode | default('2770', true) }}"
    state: 'directory'
  with_subelements:
    - "{{ lfs_mounts | selectattr('lfs', 'search', 'dat[0-9]+$') | list }}"
    - 'groups'
  tags:
    - groups
  when: inventory_hostname in pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='machines') | first | default([])
  become: true

- name: 'Create "apps" Logical File Systems (LFSs) on Physical File Systems (PFSs).'
  ansible.builtin.file:
    path: "/mnt/{{ item.pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}/{{ item.lfs }}/apps"
    owner: "{{ envsync_user }}"
    group: "{{ envsync_group }}"
    mode: '2755'
    state: 'directory'
  with_items:
    - "{{ lfs_mounts | selectattr('lfs', 'search', 'env[0-9]+$') | list }}"
  when: inventory_hostname in pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='machines') | first | default([])
  become: true

- name: Use getent to fetch GIDs.
  ansible.builtin.getent:
    database: group
    split: ':'
  tags:
    - quota
    - groups

#
# For project quota we need unique project IDs (PIDs).
# Project IDs are based on group IDs (GIDs) + a unique value per LFS: lfs_total_project_id_increment.
# This number is added to the GID to create the PID and must either be specified in
#   group_vars/all/quota.conf
# for each LFS or can be computed based on the LFS name:
#   arc += 200,000
#   prm += 400,000
#   rsc += 600,000
#   tmp += 800,000
#   home += 0    not used here to create *.quotaconfig files,
#                but hard coded range reserved for home dirs
#                and used in set_quota.bash.
#   Furthermore the LFS number is multiplied with 1,000,000.
# E.g. the project_id for LFS prm11 and a group with GID 55100210 is:
#   55,100,210 + 200,000 + (11 * 1,000,000) == 66,300,210
#
- name: 'Create quota config files for prm, rsc and tmp Logical File Systems (LFSs) on Physical File Systems (PFSs).'
  ansible.builtin.template:
    src: 'templates/quotaconfig.j2'
    dest: "/mnt/{{ item.0.pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}/groups/{{ item.1.name }}/{{ item.0.lfs }}.quotaconfig"
    owner: root
    group: "{{ item.1.name }}"
    mode: '0644'
  vars:
    group_id: "{{ getent_group[item.1.name][1] | default('') }}"
    lfs_type: "{{ item.0.lfs | regex_search('((tmp)|(rsc)|(prm))[0-9]+$', '\\1') | first }}"
    lfs_type_project_id_increment: "
      {%- if lfs_type == 'home' -%}
        0
      {%- elif lfs_type == 'arc' -%}
        200000
      {%- elif lfs_type == 'prm' -%}
        400000
      {%- elif lfs_type == 'rsc' -%}
        600000
      {%- elif lfs_type == 'tmp' -%}
        800000
      {%- endif -%}"
    lfs_number: "{{ item.0.lfs | regex_search('((tmp)|(rsc)|(prm))([0-9]+)$', '\\5') | first }}"
    lfs_number_project_id_increment: "{{ lfs_number | int * 1000000 }}"
    lfs_total_project_id_increment: "{{ lfs_quota[item.0.lfs]['quota_pid_increment']
        | default(lfs_type_project_id_increment | int + lfs_number_project_id_increment | int) }}"
    project_id: "{{ group_id | int + lfs_total_project_id_increment | int }}"
    size_soft_limit: "{{ lfs_quota[item.0.lfs]['quota_limits'][item.1.name] | default(0) | int }}"
    size_hard_limit: "
      {%- if size_soft_limit | int < 10 -%}
        {{ size_soft_limit | int }}
      {%- elif size_soft_limit | int < 10240 -%}
        {{ size_soft_limit | int + 1024 }}
      {%- else -%}
        {{ size_soft_limit | int + 2048 }}
      {%- endif -%}"
    # items_soft_limit: a.k.a inodes; not implemented yet.
    # items_hard_limit: a.k.a inodes; not implemented yet.
  loop: "{{ lfs_mounts
            | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm))[0-9]+$')
            | list
            | subelements('groups') }}"
  loop_control:
    label: "{{ item.1.name }}@{{ item.0.lfs }}:
        project_id = {{ project_id }} |
        size_soft_limit = {{ size_soft_limit }} |
        size_hard_limit = {{ size_hard_limit }}"
  tags:
    - quota
    - groups
  when: inventory_hostname in pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='machines') | first | default([])
  become: true

#
##
### Unmount LFS-ses, which are no longer configured to be mounted.
##
#
- name: 'Unmount shared storage LFS-ses no longer configured to be mounted. (WARNING: cannot check and unmount autofs mounts.)'
  ansible.posix.mount:  # noqa jinja[spacing]
    path: "{{ item['mount'] }}"
    src: "{{ item['device'] }}"
    state: absent
  vars:
    configured_lfs_mount_devices_string: "
      {%- for lfs_mount in lfs_mounts | selectattr('lfs', 'search', 'home') | list -%}
        {%- if inventory_hostname in lfs_mount['rw_machines'] | default([])
            or inventory_hostname in lfs_mount['ro_machines'] | default([]) -%}
      {{ pfs_mounts
         | selectattr('pfs', 'equalto', lfs_mount['pfs'])
         | map(attribute='source')
         | first }}/{{ lfs_mount['pfs'] }}/{{ lfs_mount['lfs'] }}#
        {%- endif -%}
      {%- endfor -%}
      {%- for lfs_mount in lfs_mounts | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$') | list -%}
        {%- if inventory_hostname in lfs_mount['rw_machines'] | default([])
            or inventory_hostname in lfs_mount['ro_machines'] | default([]) -%}
          {%- for group in lfs_mount['groups'] -%}
      {{ pfs_mounts
         | selectattr('pfs', 'equalto', lfs_mount['pfs'])
         | map(attribute='source')
         | first }}/{{ lfs_mount['pfs'] }}/groups/{{ group['name'] }}/{{ lfs_mount['lfs'] }}#
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for lfs_mount in lfs_mounts | selectattr('lfs', 'search', 'env[0-9]+$') | list -%}
        {%- if inventory_hostname in lfs_mount['rw_machines'] | default([]) -%}
      {{ pfs_mounts
         | selectattr('pfs', 'equalto', lfs_mount['pfs'])
         | map(attribute='source')
         | first }}/{{ lfs_mount['pfs'] }}/{{ lfs_mount['lfs'] }}#
        {%- endif -%}
      {%- endfor -%}
      {%- for lfs_mount in lfs_mounts | selectattr('lfs', 'search', 'env[0-9]+$') | list -%}
        {%- if inventory_hostname in lfs_mount['ro_machines'] | default([]) -%}
      {{ pfs_mounts
         | selectattr('pfs', 'equalto', lfs_mount['pfs'])
         | map(attribute='source')
         | first }}/{{ lfs_mount['pfs'] }}/{{ lfs_mount['lfs'] }}/apps#
        {%- endif -%}
      {%- endfor -%}"
    configured_lfs_mount_devices: "{{ configured_lfs_mount_devices_string
      | regex_replace('#+$', '')
      | split('#') }}"
  with_items: "{{ ansible_mounts
    | selectattr('mount', 'defined')
    | selectattr('mount', 'search', '^/(groups/)|(apps)|(home)|(mnt/env[0-9]+)')
    | selectattr('device', 'defined')
    | selectattr('device', 'search', '(^//)|(:/)')
    | sort(attribute='device')
    | list }}"
  tags:
    - groups
  when: item['device'] not in configured_lfs_mount_devices
  become: true

#
##
### Mount all LFS-ses on cluster components/machines.
##
#
- name: 'Mount "home" Logical File System (LFS) from shared storage read-write.'
  ansible.posix.mount:
    path: "/home"
    src: "{{ pfs_mounts | selectattr('pfs', 'match', item.pfs) | map(attribute='source') | first }}/\
          {{ item.pfs }}/{{ item.lfs }}"
    fstype: "{{ pfs_mounts | selectattr('pfs', 'match', item.pfs) | map(attribute='type') | first }}"
    opts: "{{ pfs_mounts | selectattr('pfs', 'match', item.pfs) | map(attribute='rw_options') | first }}"
    state: 'mounted'
  with_items: "{{ lfs_mounts | selectattr('lfs', 'search', 'home') | list }}"
  when:
    - inventory_hostname in item.rw_machines | default ([])
  become: true

- name: 'Mount "home" Logical File System (LFS) from shared storage read-only.'
  ansible.posix.mount:
    path: "/home"
    src: "{{ pfs_mounts | selectattr('pfs', 'match', item.pfs) | map(attribute='source') | first }}/\
          {{ item.pfs }}/{{ item.lfs }}"
    fstype: "{{ pfs_mounts | selectattr('pfs', 'match', item.pfs) | map(attribute='type') | first }}"
    opts: "{{ pfs_mounts | selectattr('pfs', 'match', item.pfs) | map(attribute='ro_options') | first }}"
    state: 'mounted'
  with_items: "{{ lfs_mounts | selectattr('lfs', 'search', 'home') | list }}"
  when:
    - inventory_hostname in item.ro_machines | default ([])
  become: true

- name: 'Create root /groups folder.'
  ansible.builtin.file:
    path: '/groups'
    owner: 'root'
    group: 'root'
    mode: '0755'
    state: 'directory'
  tags:
    - groups
  when:
    - lfs_mounts
      | default([])
      | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$')
      | length > 0
    - inventory_hostname in groups['compute_node'] | default([]) or
      inventory_hostname in groups['user_interface'] | default([]) or
      inventory_hostname in groups['deploy_admin_interface'] | default([]) or
      inventory_hostname in groups['chaperone'] | default([])
  become: true

- name: 'Create folder for each group in /groups.'
  ansible.builtin.file:
    path: "/groups/{{ item }}"
    owner: 'root'
    group: 'root'
    mode: '0755'
    state: 'directory'
  with_items:
    - "{{ lfs_mounts | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$')
          | map(attribute='groups') | list | flatten
          | map(attribute='name') | list | unique }}"
  tags:
    - groups
  when: inventory_hostname in groups['compute_node'] | default([]) or
        inventory_hostname in groups['user_interface'] | default([]) or
        inventory_hostname in groups['deploy_admin_interface'] | default([]) or
        inventory_hostname in groups['chaperone'] | default([])
  become: true

- name: 'Mount Logical File Systems (LFSs) per group from shared storage read-write.'
  ansible.posix.mount:
    path: "/groups/{{ item.1.name }}/{{ item.0.lfs }}"
    src: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='source') | first }}/\
          {{ item.0.pfs }}/groups/{{ item.1.name }}/{{ item.0.lfs }}"
    fstype: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='type') | first }}"
    opts: "{{ basic_opts }}{{ extra_opts }}"
    state: "{% if basic_opts is search('automount') %}present{% else %}mounted{% endif %}"
  vars:
    basic_opts: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='rw_options') | first }}"
    extra_opts: >-
      {%- if pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='type') | first == 'cifs' -%}
      ,credentials=/etc/sysconfig/{{ item.0.pfs | regex_replace('\$$', '') }}.cifs,uid={{ item.1.name }}-dm,gid={{ item.1.name }},dir_mode=02750,file_mode=0640
      {%- endif -%}
  with_subelements:
    - "{{ lfs_mounts
          | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$')
          | rejectattr('type', 'equalto', 'bind')
          | list }}"
    - 'groups'
  tags:
    - groups
  when:
    - inventory_hostname in item.0.rw_machines | default ([])
    - pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='type') | first != "beegfs"
  become: true

- name: 'Mount Logical File Systems (LFSs) per group from shared storage read-only.'
  ansible.posix.mount:
    path: "/groups/{{ item.1.name }}/{{ item.0.lfs }}"
    src: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='source') | first }}/\
          {{ item.0.pfs }}/groups/{{ item.1.name }}/{{ item.0.lfs }}"
    fstype: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='type') | first }}"
    opts: "{{ basic_opts }}{{ extra_opts }}"
    state: "{% if basic_opts is search('automount') %}present{% else %}mounted{% endif %}"
  vars:
    basic_opts: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='ro_options') | first }}"
    extra_opts: >-
      {%- if pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='type') | first == 'cifs' -%}
      ,credentials=/etc/sysconfig/{{ item.0.pfs | regex_replace('\$$', '') }}.cifs,uid={{ item.1.name }}-dm,gid={{ item.1.name }},dir_mode=02750,file_mode=0640
      {%- endif -%}
  with_subelements:
    - "{{ lfs_mounts
          | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$')
          | rejectattr('type', 'equalto', 'bind')
          | list }}"
    - 'groups'
  tags:
    - groups
  when:
    - inventory_hostname in item.0.ro_machines | default ([])
    - pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='type') | first != "beegfs"
  become: true

###############################################################################################
# Start of workaround to prevent Lustre clients from running out of Lustre IDs.
###############################################################################################
#
# Use bind mounts for group folders instead of "regular" mount as defined by the PFS for the LFS.
# The only reason to use bind mounts is to reduce the amount of Lustre IDs,
# which has a hard coded limit that will be removed in Lustre 2.17.x.
# This workaround
#  * has no benefits for other types of file systems and can be dropped
#    once all Lustre servers and clients run version >= 2.17.x
#  * has the disadvantage that the entire PFS needs to be temporarily mounted during playbook execution;
#     * this may temprarily expose data from that PFS, which is not supposed to be available
#       on the machines where the LFS-ses from a PFS are to be mounted.
#     * such data may be exposed even longer if the play fails/crashes during creation of the bind mounts,
#       and hence after the entire PFS was temporarily mounted and before it gets unmounted.
#  * is not compatible with automounts.
#
- name: 'Temporarily create read-write PFS mounts to create bind mounts for Logical File Systems (LFSs) per group.'
  ansible.posix.mount:
    path: "/mnt/{{ pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}"
    src: "{{ pfs_mount['source'] }}/{{ pfs }}"
    fstype: "{{ pfs_mount['type'] }}"
    opts: "{{ pfs_mount['rw_options'] }}"
    state: 'mounted'
  vars:
    rw_machines: "{{ lfs_mounts
                     | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$')
                     | selectattr('type', 'equalto', 'bind')
                     | rejectattr('rw_machines', 'undefined')
                     | map(atrribute='rw_machines')
                     | unique }}"
    ro_machines: "{{ lfs_mounts
                     | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$')
                     | selectattr('type', 'equalto', 'bind')
                     | rejectattr('ro_machines', 'undefined')
                     | map(atrribute='ro_machines')
                     | unique }}"
    pfs_mount: "{{ pfs_mounts | selectattr('pfs', 'equalto', pfs) | first }}"
  loop: "{{ lfs_mounts
            | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$')
            | selectattr('type', 'equalto', 'bind')
            | map(atrribute='pfs')
            | unique }}"
  loop_control:
    loop_var: pfs
  tag: groups
  when:
    - inventory_hostname in rw_machines | default ([]) or
      inventory_hostname in ro_machines | default ([])
  become: true

- name: 'Bind mount Logical File Systems (LFSs) per group from shared storage read-write.'
  ansible.posix.mount:
    path: "/groups/{{ item.1.name }}/{{ item.0.lfs }}"
    src: "/mnt/{{ item.0.pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}/\
          {{ item.0.pfs }}/groups/{{ item.1.name }}/{{ item.0.lfs }}"
    fstype: none
    opts: 'bind,rw'  # Bind mounting read-write will only work of the src was also mounted read-write.
    state: mounted
  with_subelements:
    - "{{ lfs_mounts
          | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$')
          | selectattr('type', 'equalto', 'bind')
          | list }}"
    - 'groups'
  tags:
    - groups
  when:
    - inventory_hostname in item.0.rw_machines | default ([])
    - pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='type') | first != "beegfs"
  become: true

- name: 'Bind mount Logical File Systems (LFSs) per group from shared storage read-only.'
  ansible.posix.mount:
    path: "/groups/{{ item.1.name }}/{{ item.0.lfs }}"
    src: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='source') | first }}/\
          {{ item.0.pfs }}/groups/{{ item.1.name }}/{{ item.0.lfs }}"
    fstype: none
    opts: 'bind,ro'
    state: mounted
  with_subelements:
    - "{{ lfs_mounts
          | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$')
          | selectattr('type', 'equalto', 'bind')
          | list }}"
    - 'groups'
  tags:
    - groups
  when:
    - inventory_hostname in item.0.ro_machines | default ([])
    - pfs_mounts | selectattr('pfs', 'equalto', item.0.pfs) | map(attribute='type') | first != "beegfs"
  become: true

- name: 'Remove PFS mounts, which were used to create bind mounts for Logical File Systems (LFSs) per group.'
  ansible.posix.mount:
    path: "/mnt/{{ pfs | regex_replace('\\$$', '') | regex_replace('/', '_') }}"
    src: "{{ pfs_mount['source'] }}/{{ pfs }}"
    fstype: "{{ pfs_mount['type'] }}"
    opts: "{{ pfs_mount['rw_options'] }}"
    state: absent
  vars:
    rw_machines: "{{ lfs_mounts
                     | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$')
                     | selectattr('type', 'equalto', 'bind')
                     | rejectattr('rw_machines', 'undefined')
                     | map(atrribute='rw_machines')
                     | unique }}"
    ro_machines: "{{ lfs_mounts
                     | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$')
                     | selectattr('type', 'equalto', 'bind')
                     | rejectattr('ro_machines', 'undefined')
                     | map(atrribute='ro_machines')
                     | unique }}"
    pfs_mount: "{{ pfs_mounts | selectattr('pfs', 'equalto', pfs) | first }}"
  loop: "{{ lfs_mounts
            | selectattr('lfs', 'search', '((tmp)|(rsc)|(prm)|(dat))[0-9]+$')
            | selectattr('type', 'equalto', 'bind')
            | map(atrribute='pfs')
            | unique }}"
  loop_control:
    loop_var: pfs
  tag: groups
  when:
    - inventory_hostname in rw_machines | default ([]) or
      inventory_hostname in ro_machines | default ([])
  become: true

###############################################################################################
# End of workaround to prevent Lustre clients from running out of Lustre IDs.
###############################################################################################

- name: 'Mount "env" Logical File Systems (LFSs) from shared storage read-write.'
  ansible.posix.mount:
    path: "/mnt/{{ item.lfs }}"
    src: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='source') | first }}/\
          {{ item.pfs }}/{{ item.lfs }}"
    fstype: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='type') | first }}"
    opts: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='rw_options') | first }}"
    state: 'mounted'
  with_items: "{{ lfs_mounts | selectattr('lfs', 'search', 'env[0-9]+$') | list }}"
  when:
    - inventory_hostname in item.rw_machines | default ([])
    - inventory_hostname in groups['deploy_admin_interface'] | default([])
  become: true

- name: 'Mount "env" Logical File Systems (LFSs) from shared storage read-only.'
  ansible.posix.mount:
    path: "/mnt/{{ item.lfs }}"
    src: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='source') | first }}/\
          {{ item.pfs }}/{{ item.lfs }}"
    fstype: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='type') | first }}"
    opts: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='ro_options') | first }}"
    state: 'mounted'
  with_items: "{{ lfs_mounts | selectattr('lfs', 'search', 'env[0-9]+$') | list }}"
  when:
    - inventory_hostname in item.ro_machines | default ([])
    - inventory_hostname in groups['deploy_admin_interface'] | default([])
  become: true

- name: 'Mount "apps" from one "env" Logical File System (LFS) from shared storage read-write as /apps.'
  ansible.posix.mount:
    path: '/apps'
    src: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='source') | first }}/\
          {{ item.pfs }}/{{ item.lfs }}/apps"
    fstype: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='type') | first }}"
    opts: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='rw_options') | first }}"
    state: 'mounted'
  with_items:
    - "{{ lfs_mounts | selectattr('lfs', 'search', 'env[0-9]+$') | list }}"
  when:
    - inventory_hostname in item.rw_machines | default ([])
    - inventory_hostname in groups['compute_node'] | default([]) or
      inventory_hostname in groups['user_interface'] | default([])
  become: true

- name: 'Mount "apps" from one "env" Logical File System (LFS) from shared storage read-only as /apps.'
  ansible.posix.mount:
    path: '/apps'
    src: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='source') | first }}/\
          {{ item.pfs }}/{{ item.lfs }}/apps"
    fstype: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='type') | first }}"
    opts: "{{ pfs_mounts | selectattr('pfs', 'equalto', item.pfs) | map(attribute='ro_options') | first }}"
    state: 'mounted'
  with_items:
    - "{{ lfs_mounts | selectattr('lfs', 'search', 'env[0-9]+$') | list }}"
  when:
    - inventory_hostname in item.ro_machines | default ([])
    - inventory_hostname in groups['compute_node'] | default([]) or
      inventory_hostname in groups['user_interface'] | default([])
  become: true

#
##
### Restart remote-fs.target to update systemd automount units.
##
#
- name: 'Restart systemd remote-fs.target.'
  ansible.builtin.systemd:
    name: 'remote-fs.target'
    state: 'restarted'
    daemon_reload: true
  vars:
    pfs_using_rw_automounts: "{{ pfs_mounts
        | rejectattr('rw_options', 'undefined')
        | selectattr('rw_options', 'search', 'automount')
        | map(attribute='pfs')
        | unique }}"
    pfs_using_ro_automounts: "{{ pfs_mounts
        | rejectattr('ro_options', 'undefined')
        | selectattr('ro_options', 'search', 'automount')
        | map(attribute='pfs')
        | unique }}"
  tags:
    - groups
  when:
    - inventory_hostname in lfs_mounts
          | rejectattr('pfs', 'undefined')
          | rejectattr('rw_machines', 'undefined')
          | selectattr('pfs', 'in', pfs_using_rw_automounts)
          | map(attribute='rw_machines')
          | flatten | unique or
      inventory_hostname in lfs_mounts
          | rejectattr('pfs', 'undefined')
          | rejectattr('ro_machines', 'undefined')
          | selectattr('pfs', 'in', pfs_using_ro_automounts)
          | map(attribute='ro_machines')
          | flatten | unique or
      inventory_hostname in pfs_mounts
          | rejectattr('pfs', 'undefined')
          | rejectattr('machines', 'undefined')
          | selectattr('pfs', 'in', pfs_using_rw_automounts)
          | map(attribute='machines')
          | flatten | unique
  become: true

#
##
### Deploy quota management
##
#
- name: 'Remove old deprecated quota config file.'
  ansible.builtin.file:
    path: '/etc/quota.conf'
    state: absent
  when: inventory_hostname in lfs_mounts
            | rejectattr('rw_machines', 'undefined')
            | map(attribute='rw_machines')
            | flatten | unique or
        inventory_hostname in lfs_mounts
            | rejectattr('ro_machines', 'undefined')
            | map(attribute='ro_machines')
            | flatten | unique or
        inventory_hostname in pfs_mounts
            | rejectattr('machines', 'undefined')
            | map(attribute='machines')
            | flatten | unique
  become: true

- name: Remove old deprecated quota config script.
  ansible.builtin.file:
    path: '/root/ldapquota.bash'
    state: absent
  when: inventory_hostname in groups['sys_admin_interface'] | default([])
  become: true

- name: Remove cron job for old deprecated quota config script.
  ansible.builtin.file:
    path: '/etc/cron.d/ldapquota'
    state: absent
  when: inventory_hostname in groups['sys_admin_interface'] | default([])
  become: true

- name: 'Deploy script to apply quota limits on Lustre file systems.'
  ansible.builtin.template:
    src: 'templates/set_quota.bash'
    dest: '/root/set_quota.bash'
    owner: 'root'
    group: 'root'
    mode: '0700'
  tags:
    - quota
  when: inventory_hostname in groups['sys_admin_interface'] | default([])
  become: true

- name: 'Execute script to apply quota limits on Lustre file systems.'
  ansible.builtin.command:
    cmd: '/root/set_quota.bash -a'
  changed_when: true
  tags:
    - quota
    - groups
  when: inventory_hostname in groups['sys_admin_interface'] | default([])
  become: true

- name: 'Create cron job for set_quota.bash script.'
  ansible.builtin.cron:
    name: 'Apply quota limits to shared storage mounts.'
    minute: '15'
    hour: '7-21'
    user: 'root'
    job: '/root/set_quota.bash -a'
    cron_file: 'set_quota'
  tags:
    - quota
  when: inventory_hostname in groups['sys_admin_interface'] | default([])
  become: true

