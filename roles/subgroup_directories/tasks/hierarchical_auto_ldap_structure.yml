---
#
# INSTALL auto-subgroups structure scripts
#
- name: Deploy lsaai_auth secrets into /etc/lsaai_auth
  ansible.builtin.template:
    src: "{{ item.name }}.j2"
    dest: "{{ item.path }}/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  with_items:
    - name: lsaai_auth
      path: /etc
      mode: "0640"
    - name: get_lsaai_token.sh
      path: /usr/local/sbin
      mode: "0750"
    - name: create-ldap-subgroups.sh
      path: /usr/local/sbin
      mode: "0750"
    - name: create_subgroup.sh
      path: /usr/local/bin
      mode: "0755"
  become: true
  when: subgroup_directories_auto | default(false) | bool is true

- name: Deploying systemd services for auto-generating subgroup directories
  ansible.builtin.copy:
    src: "files/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0640"
  with_items:
    - ldap_group_structure.path
    - ldap_group_structure.timer
    - ldap_group_structure.service
  notify:
    - ldap_structure_reload_systemd
    - ldap_structure_enable_service
    - ldap_structure_enable_timer
    - ldap_structure_enable_path
  become: true
  when: subgroup_directories_auto | default(false) | bool is true

- name: Allow all users to make lsaai token request via sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/92-ansible-managed-get_lsaai_token
    owner: root
    group: root
    mode: "0440"   # sudoers files must be exactly 0440
    content: |
      # Allow any user to run reveal_secret with no password
      # NOPASSWD with full path and prevent arguments
      ALL ALL=(root) NOPASSWD: /usr/local/sbin/get_lsaai_token.sh
    validate: /usr/sbin/visudo -cf %s
  become: true
  when: subgroup_directories_auto | default(false) | bool is true

#
# UN-INSTALL auto-subgroups structure scripts
#
- name: Stop and disable ldap_group_structure systemd units
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  with_items:
    - ldap_group_structure.path
    - ldap_group_structure.timer
    - ldap_group_structure.service
  failed_when: false
  become: true
  when: subgroup_directories_auto | default(false) | bool is false

- name: Remove lsaai_auth config and scripts
  ansible.builtin.file:
    path: "{{ item.path }}/{{ item.name }}"
    state: absent
  with_items:
    - name: lsaai_auth
      path: /etc
    - name: get_lsaai_token.sh
      path: /usr/local/sbin
    - name: create-ldap-subgroups.sh
      path: /usr/local/sbin
    - name: create_subgroup.sh
      path: /usr/local/bin
  become: true
  when: subgroup_directories_auto | default(false) | bool is false

- name: Remove systemd unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  with_items:
    - ldap_group_structure.path
    - ldap_group_structure.timer
    - ldap_group_structure.service
  become: true
  when: subgroup_directories_auto | default(false) | bool is false

- name: Reload systemd daemon to drop removed units
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: subgroup_directories_auto | default(false) | bool is false

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
...
