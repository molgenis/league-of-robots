---
- name: Deploy lsaai_auth into /etc/
  ansible.builtin.template:
    src: "{{ item.name }}.j2"
    dest: "{{ item.path }}/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  with_items:
    - name: lsaai_auth
      path: /etc
      mode: "0640"
    - name: get_lsaai_token.sh
      path: /usr/local/sbin
      mode: "0750"
    - name: create-ldap-subgroups.sh
      path: /usr/local/sbin
      mode: "0750"
    - name: create_subgroup.sh
      path: /usr/local/bin
      mode: "0755"
  become: true

- name: Installing systemd services for automatically calling subgroup creation script
  ansible.builtin.copy:
    src: "files/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0640"
  with_items:
    - ldap_group_structure.path
    - ldap_group_structure.timer
    - ldap_group_structure.service
  notify:
    - ldap_structure_reload_systemd
    - ldap_structure_enable_service
    - ldap_structure_enable_timer
    - ldap_structure_enable_path
  become: true

- name: Allow all users to request lsaai token
  ansible.builtin.copy:
    dest: /etc/sudoers.d/92-ansible-managed-get_lsaai_token
    owner: root
    group: root
    mode: "0440"   # sudoers files must be exactly 0440
    content: |
      # Allow any user to run reveal_secret with no password
      # NOPASSWD with full path and prevent arguments
      ALL ALL=(root) NOPASSWD: /usr/local/sbin/get_lsaai_token.sh
    validate: /usr/sbin/visudo -cf %s
  become: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
...
