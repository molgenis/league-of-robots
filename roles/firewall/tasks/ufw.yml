- name: Allow incoming access internal interfaces   
  community.general.ufw:
    rule: allow
    interface: "{{ item }}"
    direction: in
  loop: "{{ firewall_internal_interfaces }}"
  notify: restart_ufw
  become: true

- name: Enable UFW (if not already)
  ufw:
    state: enabled
    logging: 'on'
  become: true
