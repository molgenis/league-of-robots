---
- name: Ensure UFW is installed
  apt:
    name: ufw
    state: present
    update_cache: yes
  become: true

- name: Reset UFW configuration (safe and idempotent)
  command: ufw --force reset
  changed_when: false
  become: true

- name: Set default policies
  ufw:
    direction: incoming
    policy: deny
  become: true

- name: Set outgoing policy
  ufw:
    direction: outgoing
    policy: allow
  become: true

- name: Allow essential ports
  ufw:
    rule: allow
    port: "{{ item }}"
  loop: "{{ firewall_allowed_ports }}"
  notify: restart_ufw
  become: true

