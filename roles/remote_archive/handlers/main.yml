---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: 'archive_systemd_reload'
  become: true

- name: Enable and start automounts
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  listen: 'archive_mount_enable'
  with_items: "{{ desired_automounts }}"
  become: true
...
