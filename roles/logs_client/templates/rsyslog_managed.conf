{% if cluster_class_servers is defined and ( cluster_class_servers | length > 0 ) %}
$DefaultNetstreamDriver ossl

# Configuring RELP 
module( load="omrelp" tls.tlslib="openssl" )

{% for server in cluster_class_servers %}

# Configuring {{ server }}
action(  type="omrelp"
         # server settings
         target="{{ server }}"      # remote server location
         port="{{ hostvars[server].rsyslog_port | default('41514') }}"
         # TLS settings
                                    #  SSLv2  >  SSLv3  >  TLSv1.0  >  TLSv1.1  >  TLSv1.2  >  TLSv1.3
                                    #  (1995)    (1996)    (1999)      (2006)      (2008)      (2018)
         tls="on"                   # enable tls connection, with following certificates
         tls.tlscfgcmd="MinProtocol=TLSv1.3" # newest TLS only
         tls.caCert="{{ rsyslog_remote_path_cert_dir }}/{{ rsyslog_ca_cert_file }}"
         tls.myCert="{{ rsyslog_remote_path_cert_dir }}/{{ inventory_hostname }}.pem"
         tls.myPrivKey="{{ rsyslog_remote_path_key_dir }}/{{ inventory_hostname }}.key"
         tls.authmode="name"        # authentication against certificate named peer
         tls.permittedPeer=["*"]    # where names of peers need to be limited here
         tls.compression="on"       # compress the data before transfer
         # definitions about queue: in memory (with disk assistance, disk consumption limited, save on exit)
         queue.filename="fwd-{{ server }}" queue.maxdiskspace="512m" queue.maxfilesize="128m"
         queue.type="LinkedList" queue.saveonshutdown="on"
         # keep alive sessions, try prevent broken TCP connections
         KeepAlive="on"             # https://docs.rsyslog.com/doc/configuration/modules/omrelp.html
         KeepAlive.Time="60"        # idle time before the first TCP keepalive probe is sent
         KeepAlive.Interval="30"    # time between successive TCP keepalive probes
         KeepAlive.Probes="3"       # how many keepalive probes are sent before a connection is deemed dead
         Conn.Timeout="30"          # timeout for the socket connection (in seconds) [ default 10 ]
         Timeout="180"              # timeout for relp sessions (in seconds) [ default 90 ]
)

{% endfor %}

{% endif %}
