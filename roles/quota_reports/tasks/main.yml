---
- name: 'Download quota script from cluster-utils repo.'
  ansible.builtin.get_url:
    url: "{{ quota_script_url }}"
    dest: '/root/'
    mode: '0750'
  become: true

- name: 'Make sure output folder exists.'
  file:
    path: "{{ output_folder }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  become: true

- name: 'Create cronjob for monthly quota reports.'
  ansible.builtin.cron:
    name: "quota_report"
    day: "1"
    hour: "4"
    minute: "0"
    job: /root/quota -a -p | { head -4; sed -n -e '/\/groups\//,/[-]+/p'; } > "{{ output_folder }}/{{ lookup('pipe', 'date +%m') }}-quota_report_{{ inventory_hostname }}" 2>&1
    user: root
  become: true
...
