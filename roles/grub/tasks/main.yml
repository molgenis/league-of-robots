---
- name: Install latest grub2 and shim boot packages
  ansible.builtin.dnf:
    name:
      - grub2-tools
      - grub2-tools-minimal
      - grub2-tools-extra
      - grub2-efi-x64
      - shim-x64
    state: latest
    update_cache: true
  become: true

- name: Configure GRUB_TIMEOUT in /etc/default/grub.
  ansible.builtin.lineinfile:
    dest: /etc/default/grub
    mode: '0644'
    owner: root
    group: root
    create: false  # Fail task if /etc/default/grub does not exist.
    insertafter: EOF
    regexp: '^#?GRUB_TIMEOUT'
    line: "GRUB_TIMEOUT={{ grub_timeout_sec }}"
  become: true
  notify: rebuild_grub_config_by_grub_role

- name: Configure GRUB_DEFAULT in /etc/default/grub.
  ansible.builtin.lineinfile:
    dest: /etc/default/grub
    mode: '0644'
    owner: root
    group: root
    create: false  # Fail task if /etc/default/grub does not exist.
    insertafter: EOF
    regexp: "^#?GRUB_DEFAULT="
    line: 'GRUB_DEFAULT=saved'
  become: true
  notify: rebuild_grub_config_by_grub_role
  when:
    - ansible_facts['os_family'] == "RedHat"
    - ansible_facts['distribution_major_version'] >= "9"

- name: Mitigate DirtyFrag LPE bug.
  ansible.builtin.import_tasks: mitigate-dirtyfrag.yml

- name: Fix machine IDs in BLS entries.
  ansible.builtin.import_tasks: fix-machine-id-prefixes-in-bls-entries.yml
  when:
    - ansible_facts['os_family'] == "RedHat"
    - ansible_facts['distribution_major_version'] >= "9"

- name: Patch GRUB_CMDLINE_LINUX* in /etc/default/grub.
  ansible.builtin.import_tasks: patch-cmdline.yml
...
