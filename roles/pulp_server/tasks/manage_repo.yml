---
- name: "Create {{ pulp_repo['name'] }}-remote."
  pulp.squeezer.rpm_remote:
    name: "{{ pulp_repo['name'] }}-remote"
    url: "{{ pulp_repo['remote_url'] }}"
    policy: on_demand
    state: present
    pulp_url: "{{ pulp_api_baseurl }}"
    username: "{{ pulp_api_user }}"
    password: "{{ pulp_api_password }}"
    validate_certs: false
  when: pulp_repo['remote_url'] is defined
  vars:
    ansible_python_interpreter: "/admin/{{ repo_management_user }}/pulp-cli.venv/bin/python3"
  become: true
  become_user: "{{ repo_management_user }}"
  no_log: true

- name: "Create {{ pulp_repo['name'] }} repo."
  pulp.squeezer.rpm_repository:
    name: "{{ pulp_repo['name'] }}"
    description: "{{ pulp_repo['description'] }}"
    remote: "{{ omit if pulp_repo['remote_url'] is not defined else pulp_repo['name'] + '-remote' }}"
    state: present
    pulp_url: "{{ pulp_api_baseurl }}"
    username: "{{ pulp_api_user }}"
    password: "{{ pulp_api_password }}"
    validate_certs: false
  vars:
    ansible_python_interpreter: "/admin/{{ repo_management_user }}/pulp-cli.venv/bin/python3"
  become: true
  become_user: "{{ repo_management_user }}"
  no_log: true

- name: "Create remotes for alternate content sources for {{ pulp_repo['name'] }} repo."
  pulp.squeezer.rpm_remote:
    name: "{{ pulp_repo['name'] }}-{{ acs['name'] }}-acs-remote"
    url: "{{ acs['remote_url'] }}"
    policy: on_demand
    state: present
    pulp_url: "{{ pulp_api_baseurl }}"
    username: "{{ pulp_api_user }}"
    password: "{{ pulp_api_password }}"
    validate_certs: false
  vars:
    ansible_python_interpreter: "/admin/{{ repo_management_user }}/pulp-cli.venv/bin/python3"
  become: true
  become_user: "{{ repo_management_user }}"
  #no_log: true
  loop: "{{ pulp_repo['acs'] | default([]) }}"
  loop_control:
    loop_var: acs
    label: "{{ acs['name'] }}: {{ acs['remote_url'] }}"
  when: pulp_repo['acs'] is defined
...

