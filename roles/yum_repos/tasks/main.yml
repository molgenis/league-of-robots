---
- name: Flush handlers.
  ansible.builtin.meta: flush_handlers

- name: Copy repo server certificates to repo clients.
  ansible.builtin.copy:
    src: "{{ repo_servers_certificate }}"
    dest: /etc/pki/ca-trust/source/anchors/
    owner: root
    group: root
    mode: '0600'
  when: repo_manager == 'repo_server'
  notify: update-ca-trust
  become: true

- name: "Find all *.repo files in {{ yum_repos_repo_config_dir }}."
  ansible.builtin.find:
    paths: "{{ yum_repos_repo_config_dir }}"
    use_regex: false
    patterns: '*.repo'
    excludes: 'local_yum.repo'
  register: yum_repos_find_result

- name: "Remove {{ yum_repos_repo_config_dir }}/*.repo files that do not match repos configured for this host."
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop_control:
    label: "{{ item | basename }}"
  loop: "{{ yum_repos_find_result.files | map(attribute='path') | list }}"
  when: item | basename not in yum_repos[os_distribution]
                               | selectattr('id', 'in', yum_repos_deployed_on_clients[os_distribution])
                               | sort(attribute='id')
                               | unique
  become: true

- name: Fetch GPG repo keys.
  ansible.builtin.get_url:
    url: "{{ item['gpgkeysource'] }}"
    dest: "{{ yum_repos_gpgkeys_dir }}/{{ item['gpgkeysource'] | basename }}"
    owner: root
    group: root
    mode: '0644'
  loop_control:
    label: "{{ yum_repos_gpgkeys_dir }}/{{ item['gpgkeysource'] | basename }} for {{ item['id'] }}"
  loop: "{{ yum_repos[os_distribution]
            | selectattr('id', 'in', yum_repos_deployed_on_clients[os_distribution])
            | selectattr('gpgkeysource', 'defined') | flatten(levels=1) }}"
  become: true

- name: Import fetched GPG repo keys.
  ansible.builtin.rpm_key:
    state: present
    key: "{{ yum_repos_gpgkeys_dir }}/{{ item['gpgkeysource'] | basename }}"
  loop_control:
    label: "{{ yum_repos_gpgkeys_dir }}/{{ item['gpgkeysource'] | basename }} for {{ item['id'] }}"
  loop: "{{ yum_repos[os_distribution]
            | selectattr('id', 'in', yum_repos_deployed_on_clients[os_distribution])
            | selectattr('gpgkeysource', 'defined') | flatten(levels=1) }}"
  become: true

- name: "Configure community {{ yum_repos_repo_config_dir }}/*.repo files."
  ansible.builtin.include_tasks: configure_community_repos.yml
  loop_control:
    label: "{{ yum_repo.id }}"
    loop_var: yum_repo
  loop: "{{ yum_repos[os_distribution]
            | selectattr('id', 'in', yum_repos_deployed_on_clients[os_distribution])
            | flatten(levels=1) }}"
...
