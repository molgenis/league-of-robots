#
## Limit the storage for specific folder, by using a loop mount of formatted file
#
soft_partitions:
  - path: /mnt/local_raid/groups/umcg-lab/tmp05/sequencers_incoming
    src: /mnt/local_raid/groups/umcg-lab/tmp05/sequencers_incoming.disk.img
    fstype: xfs                        # xfs and btrfs support 4k that works on sequencers
    fsopts: ' -b size=4k -s size=4k'   # extra options for 4k filesystem formatting
    size: 600                 # in GB
    user: sbsuser
    group: umcg-lab
    mode: 2770
    hostname: betabarrel
#
## Optical genome mapping
#
ogm_servers:
  - server: bas1.umcg.nl  # FQDN of OGM machine to backup.
    user: ADMINIT
    prm_location: /groups/umcg-ogm/prm67
    backup_source_dirs:
      - /home/bionano/access/web/Server/databaseFiles/molecules_files
      - /var/log
      - /home/bionano/access/web/Server/Log
      - /home/bionano/access/web/Server/anchorFiles
      - /home/ADMINIT/pg_dump
    psql_dump_location: /home/ADMINIT/pg_dump
  - server: bas3.umcg.nl  # FQDN of OGM machine to backup.
    user: ADMINIT
    prm_location: /groups/umcg-ogm/prm67
    backup_source_dirs:
      - /home/bionano/access/web/Server/databaseFiles/molecules_files
      - /var/log
      - /home/bionano/access/web/Server/Log
      - /home/bionano/access/web/Server/anchorFiles
      - /home/ADMINIT/pg_dump
    psql_dump_location: /home/ADMINIT/pg_dump
    trendanalysis_api_username: 'umcg-ogm-dm'
    trendanalysis_cron_disabled: false
    trendanalysis_cron_command: "curl -s -k -H 'Cookie: token='\"$(curl -s \"https://${ogm_server}\
      :3005/administration/api/userLogin?deviceFingerprint=chaperone&userna\
      me=${trendanalysis_api_username}&password={{ ogm_api_password }}\" | grep -oP '\"to\
      ken\":\\s*\"\\K[^\"]+')\"'; userrole=3; userpk=24' https://${ogm_server}:3005/proje\
      ctbrowser/bnx/bnx_app/api/downloadQcMetricsCSV?period=90 > ${prm_location}/TrendAnalysis/${ogm_server}-$(date +%F)-${stack_prefix}.csv"
#
# Shared storage related variables
#
pfs_mounts:
  - pfs: local_raid
    #
    # The complete PFS is not mounted via the shared_storage role; See local_storage role instead.
    # Normally the source, type and rw_options are used to mount both the complete PFS
    # as well as LFS-ses from that PFS, but in this case we must use separate pfs_* arguments
    # to mount the complete PFS and these must match what was specified for this local file system.
    # The file system should have already been mounted by the local_storage role,
    # so the pfs_* arguments are de facto only used to validate that the file system was mounted correctly
    # and to ensure the play stops when this is not the case to prevent making sub directories
    # for the LFS-ses in the mount point from the small OS disk as opposed to on the PFS.
    #
    pfs_source: LABEL=local_raid
    pfs_type: xfs
    pfs_options: rw,relatime,nofail,x-systemd.device-timeout=10
    #
    # File system source, type and mount options only used for LFS-ses from this PFS.
    #
    source: '/mnt'
    type: 'none'
    rw_options: 'bind,nofail'
    ro_options: 'bind,ro,nofail'
    machines: "{{ groups['sys_admin_interface'] }}"
  - pfs: 'medgen_zincfinger$'
    source: '//storage5.umcg.nl'
    type: cifs    # checked with cat /proc/filesystem
    rw_options: 'vers=3.0,mfsymlinks,rw,soft,perm'
    ro_options: 'vers=3.0,mfsymlinks,ro,soft,perm'
    machines: "{{ groups['chaperone'] }}"
  - pfs: 'medgen_leucinezipper$'
    source: '//storage5.umcg.nl'
    type: cifs    # checked with cat /proc/filesystem
    rw_options: 'vers=3.0,mfsymlinks,rw,soft,perm'
    ro_options: 'vers=3.0,mfsymlinks,ro,soft,perm'
    machines: "{{ groups['chaperone'] }}"
  - pfs: 'medgen_wingedhelix$'
    source: '//storage5.umcg.nl'
    type: cifs    # checked with cat /proc/filesystem
    rw_options: 'vers=3.0,mfsymlinks,rw,soft,perm'
    ro_options: 'vers=3.0,mfsymlinks,ro,soft,perm'
    machines: "{{ groups['chaperone'] }}"
  - pfs: 'GCC'
    source: '//storage5.umcg.nl/algemenedata$/appdata/AdLas'
    type: cifs    # checked with cat /proc/filesystem
    rw_options: 'vers=3.0,mfsymlinks,rw,soft,perm'
    ro_options: 'vers=3.0,mfsymlinks,ro,soft,perm'
    machines: "{{ groups['chaperone'] }}"
  - pfs: 'validatie-TruSightOncology-500'
    source: '//storage5.umcg.nl/path2$/archief/MolecDiagn'
    type: cifs    # checked with cat /proc/filesystem
    rw_options: 'vers=3.0,mfsymlinks,rw,soft,perm'
    ro_options: 'vers=3.0,mfsymlinks,ro,soft,perm'
    machines: "{{ groups['chaperone'] }}"
  - pfs: 'NGSdata'
    source: '//storage5.umcg.nl/algemenedata$/appdata/BijzondereHematologie/'
    type: cifs    # checked with cat /proc/filesystem
    rw_options: 'vers=3.0,mfsymlinks,rw,soft,perm'
    ro_options: 'vers=3.0,mfsymlinks,ro,soft,perm'
    machines: "{{ groups['chaperone'] }}"
#  - pfs: 'research$'
#    source: '//storage3.umcg.nl/'
#    type: cifs    # checked with cat /proc/filesystem
#    rw_options: 'vers=3.0,mfsymlinks,rw,soft,perm'
#    ro_options: 'vers=3.0,mfsymlinks,ro,soft,perm'
#    machines: "{{ groups['chaperone'] }}"
  - pfs: 'ogm'
    source: '//storage5.umcg.nl/algemenedata$/appdata/medgen/'
    type: cifs    # checked with cat /proc/filesystem
    rw_options: 'vers=3.0,mfsymlinks,rw,soft,perm'
    ro_options: 'vers=3.0,mfsymlinks,ro,soft,perm'
    machines: "{{ groups['chaperone'] }}"
  - pfs: umcgst15
    source: "{{ ip_addresses[stack_prefix + '-storage']['vlan990']['address'] }}:/mnt"
