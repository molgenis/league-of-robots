---
slurm_cluster_name: 'betabarrel'
stack_domain: ''  # Only add hpc.rug.nl domain when jumphost is registered in DNS.
stack_name: "{{ slurm_cluster_name }}_cluster"  # stack_name must match the name of the folder that contains this vars.yml file.
stack_prefix: 'bb'
stack_dtap_state: production
slurm_version: '24.11.7-1.el9.umcg'
slurm_partitions:
  - name: cpu_r7525  # Must be in sync with group listed in Ansible inventory.
    default: yes
    nodes: betabarrel  # Must be in sync with Ansible hostnames listed in inventory.
    extra_options: 'TRESBillingWeights="CPU=1.0,Mem=0.25G"'
  - name: dragen  # Must be in sync with group listed in Ansible inventory.
    default: no
    nodes: bb-dragen  # Must be in sync with Ansible hostnames listed in inventory.
    extra_options: 'TRESBillingWeights="CPU=1.0,Mem=0.25G" PreemptMode=off'
slurm_qos_limit_fractions:
  regular-medium:
    group: 1
    user: 1
  regular-long:
    group: 1
    user: 1
  priority-short:
    user: 1
  priority-medium:
    group: 1
    user: 1
  priority-long:
    group: 1
    user: 1
  interactive-short:
    user: 0.5
repo_manager: 'none'
os_distribution: 'rocky9'
figlet_font: 'ogre'
motd: |
      =========================================================
          Welcome to {{ slurm_cluster_name | capitalize }}
      =========================================================
additional_etc_hosts:
  - group: copperfist_cluster
    nodes:
      - name: cf-dragen
        network: vlan990
      - name: copperfist
        network: vlan990
#
# Configure the SSH client on this stack for logins on other stacks listed in ssh_client_configs.
#
ssh_client_configs:
  - copperfist_cluster
  - wingedhelix_cluster
#
# Cluster classification (used by `logs` and `login` roles)
#
cluster_class: 'diagnostics'
#
# Ldap settings
#
use_ldap: true
create_ldap: false
use_sssd: true
ldap_domains:
  idvault:
    uri: ldaps://svrs.id.rug.nl
    base: ou=gd,o=asds
    schema: rfc2307
    min_id: 50100000
    max_id: 55999999
    user_object_class: posixAccount
    user_name: uid
    user_ssh_public_key: sshPublicKey
    user_member_of: groupMembership
    user_expiration_date: loginExpirationTime
    group_member: memberUid
    group_object_class: groupofnames
    create_ldap: false
totp:
  machines: "{{ groups['jumphost'] }}"
  excluded:
    - 'LOCAL'
    - "{{ all.ip_addresses['umcg']['net1']['address'] }}{{ all.ip_addresses['umcg']['net1']['netmask'] }}"
    - "{{ all.ip_addresses['umcg']['net2']['address'] }}{{ all.ip_addresses['umcg']['net2']['netmask'] }}"
    - "{{ all.ip_addresses['umcg']['net3']['address'] }}{{ all.ip_addresses['umcg']['net3']['netmask'] }}"
    - "{{ all.ip_addresses['umcg']['net4']['address'] }}{{ all.ip_addresses['umcg']['net4']['netmask'] }}"
cloud_image: Rocky-9.6
availability_zone: nova
enable_predictable_network_interface_names: true
stack_networks:
  - name: vlan1336  # Internal management for VMs and BMs
    cidr: '172.23.77.0/24'
    router:
      next-hop-address: '172.23.77.1'
      external_network: vlan16
      name: vlan1336
  - name: vlan990
    cidr: '192.168.1.0/24'
security_group_mods:
  - name: "{{ stack_prefix }}_storage"
    allow_ingress:
      - '192.168.1.0/24'  # private vlan990 for lab equipment.
  - name: "{{ stack_prefix }}_cluster"
    allow_ingress:
      - "{{ betabarrel_cluster.ip_addresses['bb-dragen']['vlan1336']['address'] }}{{ betabarrel_cluster.ip_addresses['bb-dragen']['vlan1336']['netmask'] }}"
nameservers: [
  '8.8.4.4',  # Google DNS.
  '8.8.8.8',  # Google DNS.
]
iptables_allow_icmp_inbound:
  - "{{ all.ip_addresses['umcg']['net1'] }}"
  - "{{ all.ip_addresses['umcg']['net2'] }}"
  - "{{ all.ip_addresses['umcg']['net3'] }}"
  - "{{ all.ip_addresses['umcg']['net4'] }}"
  - "{{ all.ip_addresses['rug']['bwp_net'] }}"
  - "{{ all.ip_addresses['rug']['operator'] }}"
  - "{{ all.ip_addresses['gcc']['cloud_net'] }}"
  - "{{ wingedhelix_cluster.ip_addresses['wh-porch']['vlan16'] }}"
  - "{{ betabarrel_cluster.ip_addresses['bb-porch']['vlan16'] }}"
  - "{{ copperfist_cluster.ip_addresses['cf-porch']['external'] }}"
iptables_allow_ssh_inbound:
