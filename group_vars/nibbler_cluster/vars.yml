---
slurm_cluster_name: 'nibbler'
stack_domain: 'hpc.rug.nl'
stack_name: "{{ slurm_cluster_name }}_cluster"  # stack_name must match the name of the folder that contains this vars.yml file.
stack_prefix: 'nb'
stack_dtap_state: production
slurm_version: '24.11.7-1.el9.umcg'
slurm_partitions:
  - name: cpu_r6515  # Must be in sync with group listed in Ansible inventory.
    default: no
    nodes: "{{ stack_prefix }}-node-a[01-05]"  # Must be in sync with Ansible hostnames listed in inventory.
    extra_options: 'TRESBillingWeights="CPU=1.0,Mem=0.125G" DenyQos=ds-short,ds-medium,ds-long'
  - name: gpu_a40  # Must be in sync with group listed in Ansible inventory.
    default: no
    nodes: "{{ stack_prefix }}-node-b01"  # Must be in sync with Ansible hostnames listed in inventory.
    extra_options: 'TRESBillingWeights="CPU=1.0,Mem=0.260G,GRES/gpu=3.75" DenyQos=ds-short,ds-medium,ds-long'
  - name: cpu_r630  # Must be in sync with group listed in Ansible inventory.
    default: yes
    nodes: "{{ stack_prefix }}-node-c[01-11]"  # Must be in sync with Ansible hostnames listed in inventory.
    extra_options: 'TRESBillingWeights="CPU=1.0,Mem=0.125G" DenyQos=ds-short,ds-medium,ds-long'
  - name: user_interface  # Must be in sync with group listed in Ansible inventory.
    default: no
    nodes: "{{ slurm_cluster_name }}"  # Must be in sync with Ansible hostnames listed in inventory.
    extra_options: 'TRESBillingWeights="CPU=1.0,Mem=1.0G" AllowQos=ds-short,ds-medium,ds-long'
slurm_qos_limit_fractions:
  regular-medium:
    group: 0.8
    user: 0.6
  regular-long:
    group: 0.5
    user: 0.4
  priority-short:
    user: 0.3
  priority-medium:
    group: 0.6
    user: 0.2
  priority-long:
    group: 0.3
    user: 0.2
  interactive-short:
    user: 0.5
#
# Cluster classification (used by `logs` and `login` roles)
#
cluster_class: 'research'
repo_manager: 'pulp'
os_distribution: 'alma9'
os_minorversion: '.8'
figlet_font: 'ogre'
motd: |
      ===============================================================
       Welcome to {{ slurm_cluster_name | capitalize }}
      ===============================================================
       WARNING: only prm* group dirs are backupped.
       When this cluster has to be redeployed from scratch,
       all data in home dirs and tmp* & rsc* group dirs will be lost!
      ===============================================================
additional_etc_hosts:
  - group: docs_library
    nodes:
      - name: docs-on-bateleur
        network: external
  - group: jenkins_server
    nodes:
      - name: jenkins
        network: external
  - group: build_library
    nodes:
      - name: alma9-build
        network: vlan16
  - group: donbot_azure
    nodes:
      - name: ladap
        network: donbot_external_network
#
# Configure the SSH client on this stack for logins on other stacks listed in ssh_client_configs.
#
ssh_client_configs:
  - vaxtron_cluster
ssh_host_signer_ca_private_key: "{{ ssh_host_signer_ca_keypair_dir }}/umcg-hpc-development-ca"
use_ldap: true
create_ldap: false
use_sssd: true
ldap_domains:
  sram:
    uri: ldaps://sv-sram.id.rug.nl
    base: ou=sram-umcg,ou=users,o=id
    schema: rfc2307bis
    min_id: 70000000
    max_id: 72999999
    user_object_class: posixAccount
    user_name: uid
    user_ssh_public_key: sshPublicKey
    user_member_of: groupMembership
    group_member: member
  idvault:
    uri: ldaps://svrs.id.rug.nl
    base: ou=umcg,o=asds
    schema: rfc2307
    min_id: 50100000
    max_id: 55999999
    user_object_class: posixAccount
    user_name: uid
    user_ssh_public_key: sshPublicKey
    user_member_of: groupMembership
    user_expiration_date: loginExpirationTime
    group_member: memberUid
    group_object_class: groupofnames
    listserv_mailinglist: UMCG-HPC
pam_weblogin:
  machines: "{{ groups['jumphost'] }}"
  excluded:
    - 'LOCAL'
    - "{{ all.ip_addresses['umcg']['net1']['address'] }}{{ all.ip_addresses['umcg']['net1']['netmask'] }}"
    - "{{ all.ip_addresses['umcg']['net2']['address'] }}{{ all.ip_addresses['umcg']['net2']['netmask'] }}"
    - "{{ all.ip_addresses['umcg']['net3']['address'] }}{{ all.ip_addresses['umcg']['net3']['netmask'] }}"
    - "{{ all.ip_addresses['umcg']['net4']['address'] }}{{ all.ip_addresses['umcg']['net4']['netmask'] }}"
  url: https://sram.surf.nl/pam-weblogin
  user_name: email
  min_uid: "{{ ldap_domains['sram']['min_id'] }}"
  max_uid: "{{ ldap_domains['sram']['max_id'] }}"
  retries: 3
  cache_duration: 3600  # seconds
cloud_image: AlmaLinux-9-GenericCloud-9.8-20260526
availability_zone: nova
enable_predictable_network_interface_names: true
stack_networks:
  - name: vlan1338  # Internal management for VMs and BMs
    cidr: '172.23.69.0/24'
    router:
      next-hop-address: '172.23.69.1'
      external_network: vlan16
      name: vlan1338
  - name: "{{ stack_prefix }}_internal_management"
    cidr: '10.10.1.0/24'
    router:
      next-hop-address: '10.10.1.1'
      external_network: vlan16
    create: true
    mtu_size: '1450'
  - name: vlan985  # DH4 Lustre
    cidr: '172.23.56.0/22'
  - name: vlan1068  # Private Lustre
    cidr: '172.23.60.0/24'
  - name: vlan1073  # DH5 Lustre
    cidr: '172.23.12.0/22'
security_group_mods:
  - name: "{{ stack_prefix }}_storage"
    allow_ingress:
      - 172.23.57.213/32  # Lustre server
      - 172.23.57.214/32  # Lustre server
      - 172.23.60.161/32  # Lustre server
      - 172.23.60.162/32  # Lustre server
      - 172.23.60.163/32  # Lustre server
      - 172.23.60.164/32  # Lustre server
      - 172.23.15.186/32  # Lustre server
      - 172.23.15.187/32  # Lustre server
nameservers: [
  '8.8.4.4',  # Google DNS.
  '8.8.8.8',  # Google DNS.
]
