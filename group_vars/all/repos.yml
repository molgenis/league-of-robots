---
#
## Repo servers global variables
#
repo_servers_certificate: 'logs_library/logs_development.pem'
repo_servers_certificate_key: 'logs_library/logs_development.key'
repo_servers:
  - name: repo-primary
  - name: repo-secondary
#
# Pulp repos.
#
pulp_repos:
  alma9:
    - name: baseos
      description: 'AlmaLinux 9 - BaseOS.'
      remote_url: https://repo.almalinux.org/almalinux/9/BaseOS/x86_64/os/
      acs:
        - name: "9{{ os_minorversion }}"
          remote_url: "https://repo.almalinux.org/almalinux/9{{ os_minorversion }}/BaseOS/x86_64/os/"
    - name: appstream
      description: 'AlmaLinux 9 - AppStream.'
      remote_url: https://repo.almalinux.org/almalinux/9/AppStream/x86_64/os/
      acs:
        - name: "9{{ os_minorversion }}"
          remote_url: "https://repo.almalinux.org/almalinux/9{{ os_minorversion }}/AppStream/x86_64/os/"
    - name: crb
      description: 'AlmaLinux 9 - CRB.'
      remote_url: https://repo.almalinux.org/almalinux/9/CRB/x86_64/os/
      acs:
        - name: "9{{ os_minorversion }}"
          remote_url: "https://repo.almalinux.org/almalinux/9{{ os_minorversion }}/CRB/x86_64/os/"
    - name: extras
      description: 'AlmaLinux 9 - Extras.'
      remote_url: https://repo.almalinux.org/almalinux/9/extras/x86_64/os/
      acs:
        - name: "9{{ os_minorversion }}"
          remote_url: "https://repo.almalinux.org/almalinux/9{{ os_minorversion }}/extras/x86_64/os/"
    - name: epel
      description: 'Extra Packages for Enterprise Linux 9 (EPEL).'
      remote_url: https://download.fedoraproject.org/pub/epel/9/Everything/x86_64
    - name: cpel
      description: 'UMCG Custom Packages for Enterprise Linux 9 (CPEL).'
      #remote_url: no remote for our homebrew packages.
    - name: ltb
      description: 'LTB (LDAP Tool Box) project OpenLDAP packages for Enterprise Linux 9.'
      remote_url: https://ltb-project.org/rpm/openldap25/9/x86_64/
    - name: rsyslog
      description: 'rsyslog v8 (from Adiscon) for EPEL 9.'
      remote_url: https://rpms.adiscon.com/v8-stable/epel-9/x86_64/
    - name: e2fsprogs  # Dependency for Lustre project quota.
      description: 'Ext filesystem utility releases for Enterprise Linux 9.'
      remote_url: https://downloads.whamcloud.com/public/e2fsprogs/latest/el9/
    #
    # Lustre packages still broken and cannot be installed on EL 9.x due to silly Python 2 dependency resulting in:
    # "nothing provides /usr/bin/python2 needed by lustre-client-dkms-2.15.4-1.el9.noarch from lustre"
    #
    #- name: lustre
    #  description: 'Lustre client leatest releases for Enterprise Linux 9.3.'
    #  # WARNING: There is no LTS release link for el9 yet.
    #  # WARNING: When el9.4 is released the link below for el9.3 will not get updated automatically!
    #  remote_url: https://downloads.whamcloud.com/public/lustre/latest-release/el9.3/client/
    - name: irods
      description: 'RENCI iRODS for Enterprise Linux 9.'
      remote_url: https://packages.irods.org/yum/pool/el9/x86_64/
    - name: cvmfs
      description: 'CernVM-FS repo'
      remote_url: https://cvmrepo.web.cern.ch/cvmrepo/yum/cvmfs/EL/9/x86_64/
  rocky9:
    - name: baseos
      description: 'Rocky Linux 9 - BaseOS.'
      remote_url: https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=BaseOS-9
      acs:
        - name: vault
          remote_url: "https://dl.rockylinux.org/vault/rocky/9{{ os_minorversion }}/BaseOS/x86_64/os/"
    - name: appstream
      description: 'Rocky Linux 9 - AppStream.'
      remote_url: https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=AppStream-9
      acs:
        - name: vault
          remote_url: "https://dl.rockylinux.org/vault/rocky/9{{ os_minorversion }}/AppStream/x86_64/os/"
    - name: crb
      description: 'Rocky Linux 9 - CRB.'
      remote_url: https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=CRB-9
      acs:
        - name: vault
          remote_url: "https://dl.rockylinux.org/vault/rocky/9{{ os_minorversion }}/CRB/x86_64/os/"
    - name: extras
      description: 'Rocky Linux 9 - Extras.'
      remote_url: https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=extras-9
      acs:
        - name: vault
          remote_url: "https://dl.rockylinux.org/vault/rocky/9{{ os_minorversion }}/extras/x86_64/os/"
    - name: epel
      description: 'Extra Packages for Enterprise Linux 9 (EPEL).'
      remote_url: https://download.fedoraproject.org/pub/epel/9/Everything/x86_64
    - name: cpel
      description: 'UMCG Custom Packages for Enterprise Linux 9 (CPEL).'
      #remote_url: no remote for our homebrew packages.
    - name: ltb
      description: 'LTB (LDAP Tool Box) project OpenLDAP packages for Enterprise Linux 9.'
      remote_url: https://ltb-project.org/rpm/openldap25/9/x86_64/
    - name: rsyslog
      description: 'rsyslog v8 (from Adiscon) for EPEL 9.'
      remote_url: https://rpms.adiscon.com/v8-stable/epel-9/x86_64/
    - name: e2fsprogs  # Dependency for Lustre project quota.
      description: 'Ext filesystem utility releases for Enterprise Linux 9.'
      remote_url: https://downloads.whamcloud.com/public/e2fsprogs/latest/el9/
    #
    # Lustre packages still broken and cannot be installed on EL 9.x due to silly Python 2 dependency resulting in:
    # "nothing provides /usr/bin/python2 needed by lustre-client-dkms-2.15.4-1.el9.noarch from lustre"
    #
    #- name: lustre
    #  description: 'Lustre client leatest releases for Enterprise Linux 9.3.'
    #  # WARNING: There is no LTS release link for el9 yet.
    #  # WARNING: When el9.4 is released the link below for el9.3 will not get updated automatically!
    #  remote_url: https://downloads.whamcloud.com/public/lustre/latest-release/el9.3/client/
    - name: irods
      description: 'RENCI iRODS for Enterprise Linux 9.'
      remote_url: https://packages.irods.org/yum/pool/el9/x86_64/
    - name: cvmfs
      description: 'CernVM-FS repo'
      remote_url: https://cvmrepo.web.cern.ch/cvmrepo/yum/cvmfs/EL/9/x86_64/

#
# List of all repos for machines that do not use Pulp.
#
yum_repos:
  oracle8:
    - file: oracle-linux-ol8.repo
      id: ol8_baseos_latest
      name: 'Oracle Linux 8 BaseOS Latest ($basearch)'
      baseurl: https://yum.oracle.com/repo/OracleLinux/OL8/baseos/latest/$basearch/
      gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-oracle
      gpgcheck: 1
      enabled: 1
      repo_server_download: False # _could_ be downloaded, 110 G
      tags:
        - distro
        - core
    - file: oracle-linux-ol8.repo
      id: ol8_appstream
      name: 'Oracle Linux 8 Application Stream ($basearch)'
