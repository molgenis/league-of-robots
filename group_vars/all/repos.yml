#
# Default list of yum repos that will be managed by Ansible on a machine.
# The items listed here must match 'id' attributes for repos in the 'yum_repos' variable listed above.
# If you need a different (sub)set of the repos, then you can override 'yum_repos_deployed_on_clients' for a subset of machines
# either in the group_vars for the stack, the group_vars for a specific inventory group,
# the host_vars for a specific host or the static_inventory for a stack.
#
yum_repos_deployed_on_clients:
  oracle8: "{{ yum_repos['oracle8']
              | selectattr('tags', 'defined')
              | selectattr('tags', 'intersect', ['core', 'uek', 'rsyslog'])
              | map(attribute='id') }}"
  alma9: "{{ yum_repos['alma9']
              | selectattr('tags', 'defined')
              | selectattr('tags', 'intersect', ['core', 'rsyslog'])
              | map(attribute='id') }}"
  rocky9: "{{ yum_repos['rocky9']
              | selectattr('tags', 'defined')
              | selectattr('tags', 'intersect', ['core', 'security', 'rsyslog'])
              | map(attribute='id') }}"
...
