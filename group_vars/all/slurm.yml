---
slurm_database_name: "{{ stack_prefix }}_slurm_accounting"
#
# Special a.k.a "spec" resources: these are reserved for the OS / other processes and hence not available for jobs.
# Max resources available for jobs on a node == total node resources - spec resources.
#
slurm_spec_cores_per_node: 2
#slurm_spec_mem_per_node: "{{ slurm_sockets | default(0) * slurm_cores_per_socket | default(0) * 256 | int }}"
slurm_spec_mem_per_node: "{{ (slurm_sockets * slurm_cores_per_socket * 256) }}"
#
# Determine cluster size and smallest node size based on
#  * number of compute nodes in inventory and
#  * cores per node, mem per node, etc. as specified in group_vars or inventory for cluster.
#
slurm_max_cpu_cores_per_node: "{{ slurm_sockets * slurm_cores_per_socket - slurm_spec_cores_per_node | int }}"
slurm_max_mem_per_node: "{{ slurm_real_memory - slurm_spec_mem_per_node | int }}"
...
