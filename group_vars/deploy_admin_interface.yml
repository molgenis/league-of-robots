---
local_mounts:
  - mount_point: "{{ hpc_env_prefix }}"
    device: '/dev/vdb'
    mounted_owner: root
    mounted_group: "{{ envsync_group }}"
    mounted_mode: '2775'
    mount_options: rw,relatime,nofail,x-systemd.device-timeout=10
    type: ext4
local_mount_subfolders:
  - mount_point: "{{ hpc_env_prefix }}"
    machines: "{{ groups['compute_node'] }}"
    folders:
      - rel_paths:
          - cache
        mode: '2755'
        owner: "{{ envsync_user }}"
        group: "{{ envsync_group }}"
...
