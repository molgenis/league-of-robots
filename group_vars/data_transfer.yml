---
#
# Enforce that data_transfer servers use `yum_repos` for defining repositories, since they cannot use Pulp.
#
repo_manager: 'none'
#
# Configure limited subset of repos.
# Listing the repo ID here does not mean the repo will be enabled!
# It means the repo config as listed in the yum_repos variable from
#     group_vars/all/repos.yml
# will be applied to the machine, which can include instructions for both enabling or disabling a repo.
#
managed_yum_repos:
  rocky9: "{{ yum_repos['rocky9']
              | selectattr('tags', 'defined')
              | selectattr('tags', 'contains', 'core')
              | map(attribute='id')
              | union(yum_repos['rocky9']
                      | selectattr('tags', 'defined')
                      | selectattr('tags', 'contains', 'epel')
                      | map(attribute='id'))
              | union(['security', 'rsyslog']) }}"
additional_etc_hosts: []  # Do not add additional machines to /etc/hosts on data transfer servers.
iptables_allow_icmp_inbound:
  - ANY
iptables_allow_https_inbound:
  - ANY  # On data_transfer servers port 443 is used for SSH too.
iptables_allow_ssh_inbound:
  - ANY
ssh_host_signer_hostnames: "{{ inventory_hostname }}\
    {% for network_id in ip_addresses[inventory_hostname] %}\
      {% if ip_addresses[inventory_hostname][network_id]['fqdn'] is defined and
            ip_addresses[inventory_hostname][network_id]['fqdn'] | length >= 1 %}\
        {% if ip_addresses[inventory_hostname][network_id]['fqdn'] == 'NXDOMAIN' %}\
          ,{{ ip_addresses[inventory_hostname][network_id]['address'] }}\
        {% else %}\
          ,{{ ip_addresses[inventory_hostname][network_id]['fqdn'] }}\
        {% endif %}\
      {% endif %}\
    {% endfor %}\
    {% for host in groups['jumphost'] | default([]) %}\
      ,{{ host }}+{{ inventory_hostname }}\
    {% endfor %}\
    {% for external_jumphost in external_jumphosts | default([])
       | map(attribute='hosts') | flatten
       | map(attribute='hostname') %}\
      ,{{ external_jumphost }}+{{ inventory_hostname }}\
    {% endfor %}"
local_mounts:
  - mount_point: '/groups'
    device: '/dev/vdb'
    mounted_owner: root
    mounted_group: root
    mounted_mode: '0755'
    mount_options: rw,relatime,nofail,x-systemd.device-timeout=10
    type: ext4
user_quota_on_root_partition:
  blocks_soft: 512K
  blocks_hard: 1024K
  inodes_soft: 8k
  inodes_hard: 10k
...
